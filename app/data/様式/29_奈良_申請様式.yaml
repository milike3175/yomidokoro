# 事業の範囲（第1面）。奈良の記載例 p1 の形：「1、廃プラスチック　2、紙くず　3、木くず」、石綿含有などは「含む・除く」を選ぶ、「以上 N 種類」
品目のセル:
  札: "{番号}、{名前}"
  区切り: "　"
  要確認:
    - 業務の種類は様式で「収集運搬業（積み替え・保管を含まない）」が選ばれた形のまま使います。積み替え・保管を含むなら選び直してください

区分の品目:
  石綿: [汚泥, 廃プラスチック類, ガラスくず等, がれき類]
  水銀使用製品: [廃プラスチック類, 金属くず, ガラスくず等]
  水銀含有ばいじん等: [燃え殻, 汚泥, 廃酸, 廃アルカリ, 鉱さい, ばいじん]

書かない:
  - { 見出し: 事業場・車両・車両の保管場所, 印: 要確認, 理由: 事業者から聞き取って行政書士が書く（奈良の記載例は「第2面のとおりも可」） }
  - { 見出し: 第2面 役員・株主・使用人、第3面以降, 印: 要確認, 理由: 事業者から聞き取って行政書士が書く }
