# 画面の入力欄（id は和歌山・山形と同じ）
欄:
  - { id: 申請日, 見出し: 申請日（令和）, 種類: 日付, 注: 数字だけ入れる（例：8、11、4）。空けておけば様式のまま }
  - { id: 住所, 見出し: 申請者の住所（郵便番号から）, 種類: 入力, 例: ６４０－００００　和歌山市見本町一丁目二番三号 }
  - { id: ふりがな, 見出し: ふりがな, 種類: 入力, 例: かぶしきがいしゃみほんうんゆ }
  - { id: 氏名, 見出し: 氏名（法人は名称）, 種類: 入力, 例: 株式会社みほん運輸 }
  - { id: 代表者, 見出し: 代表者の役職と氏名（法人）, 種類: 入力, 例: 代表取締役　見本　花子 }
  - { id: 電話番号, 見出し: 電話番号, 種類: 入力, 例: ０７３－０００－００００ }
  - { id: 事務所.住所, 見出し: 事務所の住所（申請者と同じなら空けておく）, 種類: 入力, 例: "", 注: 空なら申請者の住所をそのまま書く。本店と事務所が違う事業者だけ入れる }
  - { id: 事務所.電話番号, 見出し: 事務所の電話番号（同じなら空けておく）, 種類: 入力, 例: "", 注: 空なら申請者の電話番号をそのまま書く }
  - { id: 既許可1.県市, 見出し: 既に持っている許可1（都道府県・市名）, 種類: 入力, 例: 和歌山県, 注: 他の県市の産業廃棄物処理業の許可。無ければ空けておく }
  - { id: 既許可1.番号, 見出し: 既に持っている許可1（許可番号。申請中なら申請年月日）, 種類: 入力, 例: 第０３００１２３４５６号 }
  - { id: 既許可2.県市, 見出し: 既に持っている許可2（都道府県・市名）, 種類: 入力, 例: 和歌山県, 注: 他の県市の産業廃棄物処理業の許可。無ければ空けておく }
  - { id: 既許可2.番号, 見出し: 既に持っている許可2（許可番号。申請中なら申請年月日）, 種類: 入力, 例: 第０３００１２３４５６号 }
  - { id: 既許可3.県市, 見出し: 既に持っている許可3（都道府県・市名）, 種類: 入力, 例: 和歌山県, 注: 他の県市の産業廃棄物処理業の許可。無ければ空けておく }
  - { id: 既許可3.番号, 見出し: 既に持っている許可3（許可番号。申請中なら申請年月日）, 種類: 入力, 例: 第０３００１２３４５６号 }

セルの書く場所:
  - { 見出し: 申請日, 種類: セル, シート: 第1面, セル: I6, 元: '<c r="I6" s="362" t="s"><v>123</v></c>', 字: "令和{申請日.年}年{申請日.月}月{申請日.日}日" }
  - { 見出し: 郵便番号, 種類: セル, シート: 第1面, セル: G9, 元: '<c r="G9" s="364"/>', 字: "{住所.〒}" }
  - { 見出し: 住所, 種類: セル, シート: 第1面, セル: G10, 元: '<c r="G10" s="366"/>', 字: "{住所.本体}" }
  - { 見出し: 氏名（名称と代表者）, 種類: セル, シート: 第1面, セル: G12, 元: '<c r="G12" s="364"/>', 字: "{氏名}\n{代表者}", 注: 奈良の記載例は名称の次の行に代表者を書いている。Excel でセルの中の改行が見えるか確かめる }
