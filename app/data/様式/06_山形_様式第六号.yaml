# 事業の範囲（第1面）。山形の申請書記載例 p25 の形：
#   ２ 積替え保管を行わないもの／品目を「、」でつなぐ／これらのうち、…は石綿含有産業廃棄物を含む。／水銀使用製品産業廃棄物を含む。／これらのうち、特別管理産業廃棄物であるものを除く。
品目の文:
  見出し: 事業の範囲（取り扱う産業廃棄物の種類）
  見出しの文: 積替え保管を行わないもの
  区切り: 、
  含むの文: これらのうち、{名前たち}は{区分}を含む。
  水銀使用製品の文: 水銀使用製品産業廃棄物を含む。
  締めの文: これらのうち、特別管理産業廃棄物であるものを除く。
  要確認:
    - 山形の申請書記載例は、廃プラスチック類・金属くず・ガラスくず等を扱うとき「自動車等破砕物を除き」と書いています。自動車等破砕物を扱うかを確かめて、要れば書き足してください

区分の品目:
  石綿: [汚泥, 廃プラスチック類, ガラスくず等, がれき類]
  水銀使用製品: [廃プラスチック類, 金属くず, ガラスくず等]
  水銀含有ばいじん等: [燃え殻, 汚泥, 廃酸, 廃アルカリ, 鉱さい, ばいじん]

書かない:
  - { 見出し: ＦＡＸ・E-メールアドレス, 印: 要確認, 理由: 道具の入力欄に無い。行政書士が書く }
  - { 見出し: 事業場の所在地, 印: 要確認, 理由: 事務所と違う事業場（車庫など）があれば行政書士が書く }
  - { 見出し: 第2面 役員・株主・使用人, 印: 要確認, 理由: 事業者から聞き取って行政書士が書く }
  - { 見出し: 宛先の知事の氏名, 印: 要確認, 理由: 山形の申請書記載例は知事の氏名まで書いている。様式は「山形県知事」までなので、要るかを確かめる }
