# 品目の並べ方（記載例 p28 の品目の表）。第1面の札と文は和歌山と同じ形（この様式では使わない）
品目の並べ方:
  区分の名: { 石綿: 石綿含有産業廃棄物, 水銀含有ばいじん等: 水銀含有ばいじん等 }
  第1面: { 札: "{番号}．{名前}", 区切り: "　", 番号のつなぎ: "、" }
  品目表:
    含まない: "{表の名前}"
    除く: "{表の名前}（{区分たち}を除く）"
    含む: "{表の名前}（{区分}）"
    区分のつなぎ: 、
    水銀使用製品の行: 水銀使用製品産業廃棄物
    # 記載例 p28 は「がれき類（石綿含有産業廃棄物）」（5）が先、「がれき類（石綿含有産業廃棄物を除く）」（6）が後
    含むが先: true
  # 文に差し込む並び（記載例 p28 の全体計画）：品目は素の名前を「、」でつなぎ、最後だけ「並びに」。石綿・水銀使用製品は品目に添えず、型の「なお、…を含む。」の文で後ろに書く
  文:
    含まない: "{名前}"
    含む: "{名前}"
    区分のつなぎ: 、
    つなぎ: 、
    最後のつなぎ: 並びに
    水銀使用製品の名: null

