# 事業の範囲（第1面）。愛知の記載例（手引き/23_愛知県/609163_01_収運新規申請_記載例.pdf 1ページ目。2026-11-06 みゆきが県のページの一括 zip から取ってきた）の形：
#   積替え、保管を除く
#   汚泥※▲、廃プラスチック類＊※、金属くず＊、ガラスくず・コンクリートくず（…）及び陶磁器くず＊■、紙くず、がれき類■
#   以上６品目（水銀使用製品産業廃棄物を含む。）
#   ＊は自動車等破砕物を除く　※は石綿含有産業廃棄物を除く
#   ■は石綿含有産業廃棄物を含む　▲は水銀含有ばいじん等を除く（以下同様）
#   品目の名前は注意事項 1ページ目「添付書類作成にあたっての留意事項」1(1) の名前（下の 名前の言い換え）
品目の文:
  見出し: 事業の範囲（取り扱う産業廃棄物の種類）
  見出しの文: 積替え、保管を除く
  区切り: 、
  含むの文: ""
  水銀使用製品の文: ""
  締めの文: 以上{数}品目（{水銀使用製品}。）
  要確認:
    - 愛知の記載例（1ページ目）の形で書きました。印の説明は、使った印だけを記載例と同じ並びで書いています

# 印の形（記載例 1ページ目の凡例）。記載例に無い印（自動車等破砕物を含む、水銀含有ばいじん等を含む）は null にして、名前の後ろに（説明）で書き、要確認にする
品目の印:
  印たち:
    - { 区分: 自動車等破砕物, 品目: [廃プラスチック類, 金属くず, ガラスくず等], 含む: null, 除く: "＊", 含むの説明: 自動車等破砕物を含む, 除くの説明: 自動車等破砕物を除く }
    - { 区分: 石綿, 品目: [汚泥, 廃プラスチック類, ガラスくず等, がれき類], 含む: "■", 除く: "※", 含むの説明: 石綿含有産業廃棄物を含む, 除くの説明: 石綿含有産業廃棄物を除く }
    - { 区分: 水銀含有ばいじん等, 品目: [燃え殻, 汚泥, 廃酸, 廃アルカリ, 鉱さい, ばいじん], 含む: null, 除く: "▲", 含むの説明: 水銀含有ばいじん等を含む, 除くの説明: 水銀含有ばいじん等を除く }
  説明の形: "{印}は{説明}"
  一行に: 2
  説明の区切り: "　"
  説明の締め: （以下同様）
  水銀使用製品: { 含む: 水銀使用製品産業廃棄物を含む, 除く: 水銀使用製品産業廃棄物を除く }
  名前の言い換え:
    ガラスくず等: ガラスくず・コンクリートくず（工作物の新築、改築又は除去に伴って生じたものを除く。）及び陶磁器くず
    ばいじん: ダスト類
    動物のふん尿: 家畜ふん尿
    動物の死体: 家畜の死体
    13号廃棄物: 令第２条第13号廃棄物

区分の品目:
  石綿: [汚泥, 廃プラスチック類, ガラスくず等, がれき類]
  水銀使用製品: [廃プラスチック類, 金属くず, ガラスくず等]
  水銀含有ばいじん等: [燃え殻, 汚泥, 廃酸, 廃アルカリ, 鉱さい, ばいじん]
  # 愛知の独自の区分（注意事項 1ページ目の4(1)）。画面に「自動車等破砕物を含む」の印が出る。印は ＊（除く）だけで、含むは記載例に印が無いので（自動車等破砕物を含む）と書いて要確認
  自動車等破砕物: [廃プラスチック類, 金属くず, ガラスくず等]

