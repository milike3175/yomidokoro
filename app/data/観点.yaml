# 観点：県ごとに違いが出る項目の共通語彙。正は 構成/03_観点リスト.md（C7 は 構成/12 で追加）
# 品目で変わる: true の観点は、選んだ品目によって答えが変わりうる
観点:
  - 番号: A1
    id: 提出窓口
    群: 手続きの流れ
    表示名: "提出窓口"
    手引きで探すもの: "本庁か出先か。本店所在地・県外事業者で窓口が変わるか"
    電話で聞く文: "本店が県外の場合、どこに出しますか"
    品目で変わる: false
  - 番号: A2
    id: 提出方法
    群: 手続きの流れ
    表示名: "提出方法"
    手引きで探すもの: "持参／郵送／電子申請の可否。段階（事前審査と本申請）で違うか"
    電話で聞く文: "郵送で出せますか。電子申請はありますか"
    品目で変わる: false
  - 番号: A3
    id: 事前審査予約
    群: 手続きの流れ
    表示名: "事前審査・事前協議・予約"
    手引きで探すもの: "事前審査の有無、予約の要否と取り方、事前連絡の要否"
    電話で聞く文: "事前審査や予約は要りますか。どう取りますか"
    品目で変わる: false
  - 番号: A4
    id: 部数同封物
    群: 手続きの流れ
    表示名: "部数・綴じ方・同封物"
    手引きで探すもの: "正副の部数、綴じ方、返信用封筒・レターパックの要否"
    電話で聞く文: "何部出しますか。返信用の封筒は要りますか"
    品目で変わる: false
  - 番号: A5
    id: 手数料納付
    群: 手続きの流れ
    表示名: "手数料の納め方"
    手引きで探すもの: "証紙／現金／電子納付／キャッシュレス。証紙廃止の時期。納付の時点（受付日との関係）"
    電話で聞く文: "手数料は何で納めますか。いつ納めますか"
    品目で変わる: false
  - 番号: A6
    id: 処理期間
    群: 手続きの流れ
    表示名: "標準処理期間"
    手引きで探すもの: "日数。先行許可証で短くなるか"
    電話で聞く文: "審査にどれくらいかかりますか"
    品目で変わる: false
  - 番号: A7
    id: 代理人押印
    群: 手続きの流れ
    表示名: "代理人・委任状・押印"
    手引きで探すもの: "委任状の要否、行政書士の作成代理人欄、押印の有無"
    電話で聞く文: "行政書士が出す場合、委任状は要りますか"
    品目で変わる: false
  - 番号: A8
    id: 補正差替
    群: 手続きの流れ
    表示名: "補正の連絡方法と差し替え"
    手引きで探すもの: "補正連絡の手段（電話・メール・FAX）、審査中の差し替えの可否"
    電話で聞く文: "補正はどう連絡が来ますか。審査中に差し替えできますか"
    品目で変わる: false
  - 番号: A9
    id: 受付時間
    群: 手続きの流れ
    表示名: "受付時間・曜日"
    手引きで探すもの: "受付時間の限定"
    電話で聞く文: "受付の時間帯は決まっていますか"
    品目で変わる: false
  - 番号: B1
    id: 公的書類
    群: 添付書類
    表示名: "公的書類の期限・原本"
    手引きで探すもの: "3か月以内か、写しでよいか、原本照合の有無"
    電話で聞く文: "住民票などは写しでよいですか"
    品目で変わる: false
  - 番号: B2
    id: 先行許可証
    群: 添付書類
    表示名: "先行許可証による省略"
    手引きで探すもの: "省略できる書類の範囲、原本の扱い、専用様式（省略願）"
    電話で聞く文: "他県の許可証があれば省略できる書類はありますか"
    品目で変わる: false
  - 番号: B3
    id: 講習修了証
    群: 添付書類
    表示名: "講習会修了証"
    手引きで探すもの: "新規でも更新講習でよい条件、未添付の申立書"
    電話で聞く文: "他県で許可があれば更新講習の修了証でよいですか"
    品目で変わる: false
  - 番号: B4
    id: 処分業者許可証
    群: 添付書類
    表示名: "処分業者の許可証写し"
    手引きで探すもの: "県内・県外での要否、Web一覧で代えられるか"
    電話で聞く文: "運搬先の処分業者の許可証写しは要りますか"
    品目で変わる: false
  - 番号: B5
    id: 他県許可申請中
    群: 添付書類
    表示名: "自社の他県許可が申請中のとき"
    手引きで探すもの: "「申請中」の書き方、代わりになる書面"
    電話で聞く文: "他県の許可が申請中の場合はどう書きますか"
    品目で変わる: false
  - 番号: B6
    id: 写真要件
    群: 添付書類
    表示名: "車両・容器の写真の要件"
    手引きで探すもの: "撮影からの期限、角度、表示、電子車検証の扱い"
    電話で聞く文: "写真はいつ撮ったものまでよいですか"
    品目で変わる: true
  - 番号: C1
    id: 排出事業者
    群: 書き方
    表示名: "排出事業者の書き方"
    手引きで探すもの: "具体名が必須か、業種名でよいか、最低1社か"
    電話で聞く文: "排出事業者は具体名が要りますか"
    品目で変わる: true
  - 番号: C2
    id: 運搬先
    群: 書き方
    表示名: "予定運搬先の書き方"
    手引きで探すもの: "県外は府県名まででよいか、施設所在地か本店か"
    電話で聞く文: "県外の運搬先はどう書きますか"
    品目で変わる: true
  - 番号: C3
    id: 変更許可範囲
    群: 書き方
    表示名: "変更許可で書く範囲"
    手引きで探すもの: "追加分だけか全体か（面ごとに違う）、下線の要否"
    電話で聞く文: "変更許可では追加する品目だけ書けばよいですか"
    品目で変わる: false
  - 番号: C4
    id: 品目表記
    群: 書き方
    表示名: "品目・付加区分の表記"
    手引きで探すもの: "石綿含有・水銀・自動車等破砕物の括弧書きや記号、行の分け方"
    電話で聞く文: "石綿含有を含む場合の書き方はどうしますか"
    品目で変わる: true
  - 番号: C5
    id: 性状
    群: 書き方
    表示名: "性状の書き方"
    手引きで探すもの: "「固形状」で足りるか具体物まで書くか"
    電話で聞く文: "性状はどこまで具体的に書きますか"
    品目で変わる: true
  - 番号: C6
    id: 独自様式
    群: 書き方
    表示名: "県独自の様式"
    手引きで探すもの: "省令様式以外の県様式、一括ファイル、配布形式（ZIP・Excel）"
    電話で聞く文: "県独自の様式はありますか"
    品目で変わる: false
  - 番号: C7
    id: 事業計画概要
    群: 書き方
    表示名: "事業計画の概要の書き方"
    手引きで探すもの: "1面の事業の範囲・変更の内容、排出から運搬先までの流れの書き方"
    電話で聞く文: "事業計画の概要は、どこまで具体的に書きますか"
    品目で変わる: false
  - 番号: D1
    id: 石綿
    群: 品目別の運用
    表示名: "石綿含有の運び方"
    手引きで探すもの: "容器（フレコン・二重梱包）、湿潤化、第5面の記載"
    電話で聞く文: "石綿含有はどの容器で運ぶ前提で書きますか"
    品目で変わる: true
  - 番号: D2
    id: 水銀
    群: 品目別の運用
    表示名: "水銀含有・水銀使用製品の運用"
    手引きで探すもの: "成分表の要否、容器、ガイドライン準拠の記載"
    電話で聞く文: "水銀含有ばいじん等を含める場合、追加の書類はありますか"
    品目で変わる: true
  - 番号: D3
    id: 破砕物
    群: 品目別の運用
    表示名: "自動車等破砕物の扱い"
    手引きで探すもの: "扱うかどうかの明記の要否"
    電話で聞く文: "自動車等破砕物の記載は要りますか"
    品目で変わる: true
  - 番号: E1
    id: 届と許可の線引き
    群: 変更届
    表示名: "変更届と変更許可の線引き"
    手引きで探すもの: "車両・役員・品目のどれが届で、どれが許可か"
    電話で聞く文: "車両の追加は届出でよいですか"
    品目で変わる: false
  - 番号: E2
    id: 車両変更届
    群: 変更届
    表示名: "車両の変更届の出し方"
    手引きで探すもの: "期限（10日）、部数、写真の要否、遅延理由書、同時提出の省略"
    電話で聞く文: "車両の変更届と変更許可を同時に出せますか"
    品目で変わる: false
  - 番号: F1
    id: 政令市
    群: 広域
    表示名: "政令市・中核市の扱い"
    手引きで探すもの: "県一本で市域も運べるか、市に別申請か"
    電話で聞く文: "市内も運ぶ場合、市にも申請が要りますか"
    品目で変わる: false
  - 番号: F2
    id: 県外搬入協議
    群: 広域
    表示名: "県外産廃搬入の事前協議"
    手引きで探すもの: "収集運搬（積替なし）が対象か、制度の有無・廃止"
    電話で聞く文: "県外からの搬入に事前協議は要りますか"
    品目で変わる: false
  - 番号: G1
    id: 経理的基礎
    群: 審査基準
    表示名: "経理的基礎の審査"
    手引きで探すもの: "追加書類、診断士チェックシート、ケース分け"
    電話で聞く文: "決算が赤字の場合、追加書類は要りますか"
    品目で変わる: false
  - 番号: H1
    id: 手引き版
    群: 鮮度
    表示名: "手引きの版と改訂日"
    手引きで探すもの: "版の年月、改訂概要"
    電話で聞く文: "手引きの最新版はいつのものですか"
    品目で変わる: false
  - 番号: H2
    id: 電子申請移行
    群: 鮮度
    表示名: "電子申請の移行状況"
    手引きで探すもの: "電子申請・電子納付の開始予定"
    電話で聞く文: "電子申請はいつから使えますか"
    品目で変わる: false
