# はじめての許認可モード（npm run 探す ／ npm run はじめて読む）で使う、どの許認可にも共通する観点。
# 産廃収集運搬の観点（観点.yaml）とは別。ここを書き換えると、次に読むときの問いが変わる。
# id：記録に付く名前（変えると前の結果と突き合わなくなる）
# 表示名：画面の見出し
# 探すもの：Claude に渡す説明。手引き・案内ページのどこを探すか
観点:
  - id: 提出先・窓口
    表示名: 提出先・窓口
    探すもの: 申請書を出す先の部署・課名・出先機関（地域ごとの振り分けがあればその決まり）。所在地まで書いてあれば添える
  - id: 提出方法
    表示名: 提出方法（持参・郵送・電子）
    探すもの: 窓口に持参か、郵送でよいか、電子申請（オンライン・メール）ができるか。それぞれの条件
  - id: 事前相談・予約
    表示名: 事前相談・予約
    探すもの: 申請前の相談が要るか、窓口の予約が要るか、予約の方法と時期
  - id: 部数・綴じ方
    表示名: 部数・綴じ方
    探すもの: 正本・副本の部数、控えの扱い、綴じる順番・インデックス・ファイルの指定
  - id: 手数料
    表示名: 手数料の額と納め方
    探すもの: 手数料の金額（無料ならそのこと）、納め方（収入証紙・現金・納付書・キャッシュレス）
  - id: 標準処理期間
    表示名: 標準処理期間・交付までの日数
    探すもの: 受け付けてから許可・交付までの日数（即日交付かどうか）。期間に入らない日の決まり
  - id: 独自の様式・添付書類
    表示名: 独自の様式・添付書類
    探すもの: その自治体だけの様式・チェックリスト・添付書類（全国共通の法令の書類ではないもの）
  - id: 本人確認・委任状
    表示名: 本人確認・委任状・代理申請
    探すもの: 申請者の本人確認書類、代理人が出すときの委任状の要否と書き方、行政書士が代理できるか
  - id: 受付時間
    表示名: 受付時間
    探すもの: 窓口の受付日・受付時間、昼休み、受け付けない日（締め切り時刻など）
  - id: 有効期間・更新
    表示名: 有効期間・更新
    探すもの: 許可・証明の有効期間、更新の申請ができる時期（何日前から何日前まで）。期間の決まりが無いものはそのこと
  - id: 補正の連絡
    表示名: 補正・不備の連絡
    探すもの: 書類に不備があったときの連絡のしかた、補正の期限、取下げの扱い
  - id: 問い合わせ先
    表示名: 問い合わせ先
    探すもの: 問い合わせ先の課名・電話番号・受付時間（担当者の個人名は拾わない）
