# 書き方の型：愛知県 事業計画の概要（様式第六号の二、667389_3083495_misc.docx）の文。
# 公開してよいデータ（県の記載例を写したもので、事業者の情報は入っていない）。
#
# 作り方（2026-11-06 ジョブズ）：愛知県の記載例 609163_01_収運新規申請_記載例.pdf（手引き/23_愛知県/。県のページの一括 zip 609163.zip の中。
# みゆきがブラウザで落とした）の p4（第1面 全体計画と品目の表）・p7（第4面 具体的な計画）・p8（第5面 環境保全措置）から。
# 注意事項 560336.pdf 1ページ目「添付書類作成にあたっての留意事項」1 も読んだ。
# マスの行数は、白紙の様式の行の高さ（第1面 4740・第4面 10610・第5面 13841 twips、一行 300）から、全体計画 14・具体的な計画 30・環境保全 40 と決めた。
#
# 読んで決めたこと：
#   - 愛知は品目名の後ろに印（＊※■▲）を付ける。全体計画は品目ごとに「印つきの名前」の行と「・〇〇から排出される〇〇を収集し、〇〇へ運搬する。」の行（p4）。
#     混合物（「混合物（廃プラスチック類＊※、…）」）や製品名（「直管蛍光管（金属くず＊、…（以上、水銀使用製品産業廃棄物を含む。））」）は品目のまとめ方が会社ごとなので、道具は品目ごとの行にし、行政書士が直す
#   - 具体的な計画（p7）は「・車両毎の用途」に車両ごと一行「1. キャブオーバ ・汚泥※▲：運搬容器のドラム缶に入れ、密閉して運搬する。」、「・収集運搬作業を行う時間」「・休業日」、最後に印の説明を一行ずつ。
#     従業員数の内訳はマスの下の表で、道具は書かない
#   - 環境保全（p8）は (1) 運搬に際し講ずる措置（一行ずつの箇条書き。句点なし）、(2) 積替え又は保管施設において講ずる措置（行わなければ「該当なし」。p8 の余白の注）、(3) その他（特別な措置があれば）
#   - 記載例の数字（運搬量・人数・台数）・社名・住所は型に入れない。会社ごとに変わる所だけを空きにし、決まり文句は「まま」で写す
#
# 行の書き方（和歌山・山形の型と同じ）：
#   字：様式に書く文。{差し込み口の id} を差し込む。"" は空けておく行。{品目の印の説明} は印の説明の行たち（使った印だけ、一行ずつ）
#   続きの頭：一行に収まらず次の段落へ送るとき、2行目以降の頭に置く全角空白の数
#   条件：控えの選びで出すかどうか（石綿あり・水銀使用製品あり・水銀含有ばいじん等あり・積替保管無・積替保管有・積替保管未選択）
#   落とせる：欄の行が足りないとき、先に落とす行。守る：欄の行が足りなくても必ず書く行
#   出典：基づいた資料とページ（記載例の p は PDF のページ）
#   写し：まま＝記載例の文をそのまま／一部＝差し込み口のほかは記載例のまま／組み替え＝記載例の言い回しを道具が組み替えた／なし＝記載例に文が無く、道具が【要確認】を置いた
# 差し込み口が空なら、様式に「【要確認：見出し】」を残す。道具は数字や事実を作らない。
sha256: 7818c70a663b2ba38616a1f6c130b32e250cbf508f8ab9951f31c4babf7f83a8
名前: 事業計画の概要（様式第六号の二）
県名: 愛知県
資料:
  記載例: 609163_01_収運新規申請_記載例.pdf（愛知県 収集運搬業 新規申請の記載例。事業計画の概要は p4〜p9）
  注意事項: 560336.pdf（愛知県 収集運搬業許可申請にあたっての注意事項）

差し込み口:
  - id: 品目の並び
    種類: 自動
    見出し: 取り扱う品目の並び
    説明: 控えの品目から作る。愛知は品目名の後ろに印（＊※■▲）を付ける（記載例 p1・p4）
  - id: 23_品目ごとの計画
    種類: 品目ごと
    見出し: 品目ごとの全体計画（どこから出る何を、どこへ運ぶか）
    説明: 第1面「１．事業の全体計画」に、品目ごとに「・〇〇から排出される〇〇を収集し、〇〇へ運搬する。」と書きます（記載例 p4「水質処理施設から排出される汚泥を密閉容器に入れて収集し、中間処分場（脱水）へ運搬する。」）。空けた所は【要確認】を残します
    項目:
      - { id: 排出元の説明, 見出し: どこから出るか, 例: 水質処理施設, 説明: 記載例 p4「水質処理施設」「県内建設現場」「県内事業場」「大規模小売店」 }
      - { id: 何を, 見出し: 何を, 例: 汚泥, 説明: 記載例 p4「汚泥」「建設系混合廃棄物」「蛍光管」「発泡スチロール及びペットボトル」 }
      - { id: 運搬先の説明, 見出し: どこへ運ぶか, 例: 中間処分場（脱水）, 説明: 記載例 p4「中間処分場（脱水）」「中間処分場（選別）」「最終処分場」。他社の積替え保管施設を経るときは「自社積替え保管施設で保管し、最終処分場へ運搬する」 }
  - id: 品目ごとの運搬
    種類: 品目ごと
    見出し: 品目ごとの運搬量・性状・排出事業場・運搬先
    説明: 第1面の２の表に、品目ごとに一行で書きます（記載例 p4）。排出事業場が複数あるときは代表的な事業場と「他○社」、工事現場などで特定できないときは事務所の所在地に加えて「（県内各工事現場）」（注意事項 1ページ目 1(2)、記載例 p4 の余白の注）
    項目:
      - { id: 運搬量, 見出し: 運搬量（t/月 または m3/月）, 例: 20m3/月 }
      - { id: 性状, 見出し: 性状, 例: 固形, 説明: 記載例 p4 は「泥状」「固形」 }
      - { id: 排出元, 見出し: 予定排出事業場の名称及び所在地, 例: ○○株式会社「他５社」　○○市○○町1丁目1番地, 説明: 記載例 p4「半田㈱「他５社」 半田市出口町１丁目45番地４」「豊川㈱（建設業） 豊川市諏訪三丁目237（県内各工事現場）」。業種指定のある品目は排出事業者の業種も }
      - { id: 積替保管場所, 見出し: 積替え又は保管を行う場所の所在地（行わないときは「該当なし」）, 例: 該当なし, 説明: 記載例 p4 は行わない品目に「該当なし」 }
      - { id: 運搬先, 見出し: 予定運搬先の名称及び所在地（名称の後ろに（処分方法））, 例: ○○株式会社（脱水）　○○市○○町1丁目1番地, 説明: 記載例 p4「春日井㈱（脱水） 春日井市柏井町二丁目31番地」。愛知県許可以外の処理業者なら、申請者の収集運搬業の許可証と運搬先の処分業の許可証の写しを添付（記載例 p4 の余白の注） }
  - id: 車両
    種類: くり返し
    見出し: 車両
    最大: 10
    説明: 第4面「・車両毎の用途」に車両ごとに一行で書きます（記載例 p7「1. キャブオーバ ・汚泥※▲：運搬容器のドラム缶に入れ、密閉して運搬する。」）。運ぶ品目は印つきの名前で（画面の「様式にこう書きます」の名前をそのまま）。第2面の運搬車両一覧はまだ道具では書きません
    項目:
      - { id: 車体の形状, 見出し: 車体の形状（車検証のとおり）, 例: キャブオーバ }
      - { id: 運ぶ品目, 見出し: その車両で運ぶ品目（印つき）, 例: 汚泥※▲ }
      - { id: 23_運び方, 見出し: その車両での運び方（容器・積み方）, 例: 運搬容器のドラム缶に入れ、密閉して運搬する。, 説明: 記載例 p7「運搬容器のドラム缶に入れ、密閉して運搬する。」「混合物をシート掛けして運搬する。」「専用のケースに入れて運搬する。」 }
      - { id: 登録番号, 見出し: 自動車登録番号又は車両番号, 例: 名古屋１００あ１２３４ }
      - { id: 最大積載量, 見出し: 最大積載量（kg）, 例: "4,000" }
      - { id: 所有者, 見出し: 所有者又は使用者, 例: 申請者 }
    写真:
      - { id: 前面, 見出し: 前面の写真 }
      - { id: 側面, 見出し: 側面の写真 }
  - id: 時間
    種類: 聞き取り
    見出し: 収集運搬作業を行う時間
    例: ９時～１７時（休憩 １時間）
    説明: 記載例 p7「９時～１７時（休憩 1 時間）」
  - id: 休業日
    種類: 聞き取り
    見出し: 休業日
    例: 日曜、祝祭日、年末年始（１２月２８日～１月３日）
    説明: 記載例 p7
  - id: 23_容器の措置
    種類: 聞き取り
    見出し: 容器を使う品目の運び方（運搬に際し講ずる措置）
    例: 汚泥はドラム缶により運搬
    説明: 記載例 p8「汚泥はドラム缶により運搬」。容器を使う品目が無ければ、様式に残る【要確認】の行を消してください
  - id: 23_積替保管の措置
    種類: 聞き取り
    見出し: 積替え又は保管施設において講ずる措置（積替保管「有」のときだけ）
    例: 屋内で積み替え、保管を行う事により、飛散流出を防止する。また、床面はコンクリート舗装とし、地下浸透を防止する。
    説明: 記載例 p8「屋内で積み替え、保管を行う事により、飛散流出を防止する。また、床面はコンクリート舗装とし、地下浸透を防止する。」「石綿含有産業廃棄物は、品目ごとに分別したまま、飛散しないよう保管する。」。施設の造りが会社ごとなので、型の文は置きません
  - id: 23_その他の措置
    種類: 聞き取り
    見出し: その他の環境保全措置（特別な措置があれば）
    例: ＩＳＯ１４０００を取得し、環境負荷の低減を推進する。
    説明: 記載例 p8「ＩＳＯ１４０００を取得し、環境負荷の低減を推進する。」。余白の注「環境保全に対し特別な措置を講ずる場合は記載してください」。無ければ、様式に残る【要確認】の行を消してください

