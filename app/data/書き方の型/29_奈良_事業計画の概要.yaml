    注: 土砂禁の車両で「がれき類」「鉱さい」は運べない。塵芥車（パッカー車）で「がれき類」「石綿含有産業廃棄物」「水銀使用製品産業廃棄物」「水銀含有ばいじん等」は運べない（記載例の注）
    行:
      - くり返し: 車両
        字: ""
        出典: 20260122101427.pdf
        写し: 一部
        空なら: "【要確認：車両毎の用途（車体の形状と、その車両で運ぶ品目）】"
        行:
          - { 字: "{番号}{車体の形状}", 守る: true, 出典: 20260122101427.pdf（「①脱着装置付コンテナ専用車」）, 写し: 一部 }
          - { 字: "　{運ぶ品目}", 続きの頭: 1, 守る: true, 出典: 20260122101427.pdf（「木くず、がれき類（石綿含有産業廃棄物を除く）」）, 写し: 一部 }

