# 書き方の型：奈良県 事業計画の概要（申請様式 20260122101422.xlsx の「04_第1面」「06_第4面」「07_第5面」のシート）の文。
# 公開してよいデータ（県の記載例を写したもので、事業者の情報は入っていない）。
#
# 作り方（2026-11-06 夜 ジョブズ）：県の面ごとの記載例 PDF（手引き/29_奈良県/記載例/。文字は txt/）から。
#   第1面 20260122101425_1.pdf、第2面 20260122101426.pdf、第4面 20260122101427.pdf、第5面 20260122101428.pdf
# 様式のシートには「（記載例）」の見本の字が入っている（第1面 B6、第4面 A5、第1面の表の 11〜13 行）。道具はそれを置き換える（対応表の セルの文・セルの表）。
#
# 読んで決めたこと：
#   - 全体計画（第1面）は二文「県内の建設等工事現場で発生する建設系廃棄物を処分業者に運搬する。」「適正な処理のため、法に基づく処理基準を遵守する。」。
#     排出元と品目は会社ごとなので差し込む。石綿を含むときは三文目「石綿含有産業廃棄物は、排出事業者との委託契約により、それらが含まれる旨を明らかにし、適正に収集運搬する。」（記載例の注「申請書第１面で石綿含有産業廃棄物を『含む』に○をした場合、必ず記載」）
#   - 具体的な計画（第4面）は (1) 車両毎の用途「①脱着装置付コンテナ専用車／木くず、がれき類（石綿含有産業廃棄物を除く）」の形で車両ごと、(2) 時間「９時～17時（休憩 １時間）」、(3) 休業日。(2)(3) は対応表のセルに直に書く
#   - 環境保全（第5面）は「○ 飛散流出防止措置」の見出しの下に箇条書き。飛散流出防止は会社ごと（記載例は「（例）荷台へのシート掛け、その他容器の転倒防止等を図る。」）。
#     石綿・水銀使用製品・水銀含有ばいじん等は記載例の決まり文句（水銀使用製品の製品名と容器、水銀含有ばいじん等の運搬方法は空き）
#   - 記載例の数字・社名・住所は型に入れない
#
# 行の書き方（和歌山・山形・愛知・京都の型と同じ）。{差し込み口の id} を差し込む。条件は 中身の印 の鍵
sha256: 2cc8a3ae9dc29f69dc38badd9edceb0c03adc362bdbf6e0d6f0644b6882b67f0
名前: 事業計画の概要（申請様式の後ろのシート）
県名: 奈良県
資料:
  記載例: 手引き/29_奈良県/記載例/（第1面 20260122101425_1.pdf、第2面 20260122101426.pdf、第4面 20260122101427.pdf、第5面 20260122101428.pdf）

差し込み口:
  - id: 品目の並び
    種類: 自動
    見出し: 取り扱う品目の並び
    説明: 控えの品目から作る。全体計画の一文目に差し込む（記載例「建設系廃棄物」）
  - id: 排出元
    種類: 聞き取り
    見出し: 排出事業場（どこで発生する廃棄物か）
    例: 奈良県内の建設等工事現場
    説明: 記載例「県内の建設等工事現場で発生する建設系廃棄物を」
  - id: 時間
    種類: 聞き取り
    見出し: 収集運搬業務を行う時間
    例: ９時～17時（休憩 １時間）
    説明: 記載例 第4面 (2)
  - id: 休業日
    種類: 聞き取り
    見出し: 休業日
    例: 日曜、祝日、年末年始（12月28日～１月３日）
    説明: 記載例 第4面 (3)
  - id: 駐車場
    種類: 聞き取り
    見出し: 駐車場（車庫）の所在地
    例: 奈良県奈良市○○町△△番地
    説明: 第2面「駐車場の所在地」。事務所と同じなら「同上」と書いてもよい（記載例）
  - id: 29_飛散流出防止措置
    種類: 聞き取り
    見出し: 飛散流出防止の措置（具体的に）
    例: 荷台へのシート掛け、その他容器の転倒防止等を図る。
    説明: 第5面「○ 飛散流出防止措置」。記載例の注「廃棄物の飛散流出防止措置を具体的に記載してください」
  - id: 29_水銀使用製品の製品名
    種類: 聞き取り
    見出し: 水銀使用製品産業廃棄物の具体的な製品名（蛍光灯など）
    例: 蛍光ランプ
    説明: 記載例の注「○○○○には具体的な製品名」
  - id: 29_水銀使用製品の容器
    種類: 聞き取り
    見出し: 水銀使用製品産業廃棄物を収納する容器
    例: 専用の蛍光灯回収箱
    説明: 記載例の注「△△△△には使用する容器や具体的な運搬方法」
  - id: 29_水銀含有ばいじん等の運搬方法
    種類: 聞き取り
    見出し: 水銀含有ばいじん等の運搬方法（容器など）
    例: 密閉容器に入れ、高温にさらされないようにする
    説明: 記載例の注「運搬中に水銀が揮発しないよう、密閉容器と高温にさらされない措置」
  - id: 品目ごとの運搬
    種類: 品目ごと
    見出し: 品目ごとの運搬量・性状・排出事業場・運搬先
    説明: 第1面の２の表に、品目ごとに一行で書きます（記載例 第1面）。処分場の所在地は市町村まで。県外へ運搬するときは「排出事業者の指定する県外の産業廃棄物処分業者」の記載も可
    項目:
      - { id: 運搬量, 見出し: 運搬量（t/月 または m3/月）, 例: 10 t/月, 説明: 数と単位に分けて書く }
      - { id: 性状, 見出し: 性状, 例: 固形, 説明: 記載例は「泥状」「固形」 }
      - { id: 排出元, 見出し: 予定排出事業場の名称及び所在地, 例: ○○建設(株)　奈良県内 }
      - { id: 積替保管場所, 見出し: 積替え又は保管を行う場所の所在地（行わないときは空のまま。様式の「なし」が残る）, 例: "" }
      - { id: 運搬先, 見出し: 予定運搬先の名称及び所在地（市町村まで）, 例: 株式会社□□□□　奈良県○○市 }
  - id: 車両
    種類: くり返し
    見出し: 車両
    最大: 10
    説明: 第2面の運搬車両一覧（記載例「脱着装置付コンテナ専用車／奈良 100 あ 11－11／3,800／車検証のとおり／新規」）と、第4面の車両毎の用途（「①脱着装置付コンテナ専用車／木くず、がれき類（石綿含有産業廃棄物を除く）」）に書きます
    項目:
      - { id: 車体の形状, 見出し: 車体の形状（車検証のとおり）, 例: 脱着装置付コンテナ専用車 }
      - { id: 登録番号, 見出し: 自動車登録番号又は車両番号, 例: 奈良 100 あ 11－11 }
      - { id: 最大積載量, 見出し: 最大積載量（kg）, 例: "3800" }
      - { id: 所有者, 見出し: 所有者又は使用者, 例: 車検証のとおり }
      - { id: 運ぶ品目, 見出し: その車両で運ぶ品目, 例: 木くず、がれき類（石綿含有産業廃棄物を除く） }
  - id: 容器
    種類: くり返し
    見出し: 運搬容器等
    最大: 4
    説明: 第2面 (2) その他の運搬施設の概要（記載例「コンテナ／木くず、金属くず、…／○㎥」「フレコンバッグ／がれき類（石綿含有産業廃棄物を含む）／○㎥」）
    項目:
      - { id: 名称, 見出し: 運搬容器等の名称, 例: コンテナ }
      - { id: 用途, 見出し: 用途（何を入れるか）, 例: がれき類（石綿含有産業廃棄物を含む） }
      - { id: 容量, 見出し: 容量, 例: ２㎥ }
      - { id: 数, 見出し: 備考（数など）, 例: "" }

欄:
  # 第1面「１．事業の全体計画」（記載例 20260122101425_1.pdf）
  - id: 全体計画
    見出し: １．事業の全体計画
    注: 記載例の二文（石綿を含むときは三文）。会社の実際に合わせて行政書士が直してください
    行:
      - { 字: "{排出元}で発生する{品目の並び}を処分業者に運搬する。", 守る: true, 出典: 20260122101425_1.pdf（「県内の建設等工事現場で発生する建設系廃棄物を処分業者に運搬する。」）, 写し: 一部 }
      - { 字: "適正な処理のため、法に基づく処理基準を遵守する。", 守る: true, 出典: 20260122101425_1.pdf, 写し: まま }
      - { 字: "石綿含有産業廃棄物は、排出事業者との委託契約により、それらが含まれる旨を明らかにし、適正に収集運搬する。", 条件: 石綿あり, 守る: true, 出典: 20260122101425_1.pdf（注「申請書第１面で石綿含有産業廃棄物を『含む』に○をした場合、必ず記載」）, 写し: まま }

  # 第4面「(1) 車両毎の用途」（記載例 20260122101427.pdf）。車両ごとに ①車体の形状 と次の行に運ぶ品目
  - id: 車両毎の用途
