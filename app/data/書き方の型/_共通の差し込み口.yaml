# 書き方の型の「差し込み口」の共通の名前（id）。県ごとの型は、ここにある id を同じ意味で使う。
# 2026-11-05 ジョブズ。みゆきの頼み「事業計画の概要とか収集運搬の具体的な計画とか、県ごとに色が違うので、そこをしっかりカバーできるようにして」。
#
# なぜ共通にするか：名簿に一度入れた事業者さんの聞き取り（運搬量・性状・排出事業場・運搬先・車両・時間…）を、
# どの県の型にもそのまま差し込めるようにするため。id が県ごとにばらばらだと「一度入れれば全部の県」が崩れる。
#
# 決まり：
#   - 和歌山の型（30_和歌山_様式第六号.yaml）の id をそのまま土台にした。和歌山の id は変えない（名簿の控えがもう使っている）
#   - 県にしか無い空き（例：愛知の自動車等破砕物の有無、秋田の性状の書き方）は、県の型で足してよい。id の頭に県コードを付ける（例：23_自動車等破砕物）
#   - 値たちの中の鍵の形：聞き取り＝「型.<id>」、くり返し＝「型.<id>.<組の番号>.<項目>」、品目ごと＝「型.<id>.<品目の鍵>.<項目>」
#   - 道具は数字や事実を作らない。空いている口は様式に「【要確認：見出し】」を残す。記載例の数字（20 t/月 など）は「例」にだけ書き、型の文には入れない
#   - 見出し・例は画面にそのまま出る。日常語で、行政書士が電話で聞く順に
版: 1

# ---- 全体に一つの口 ----
全体:
  - { id: 品目の並び, 種類: 自動, 見出し: 取り扱う品目の並び, 説明: 控えの品目から道具が作る。県の並べ方（品目の並べ方）に従う }
  - { id: 品目の言い方, 種類: 聞き取り, 見出し: 品目のまとめた言い方, 例: 建設系廃棄物, 空なら: 品目の並び, 説明: 空なら控えの品目を並べて書く }
  - { id: 排出元, 種類: 聞き取り, 見出し: どこから出る廃棄物か（全体）, 例: 和歌山県内の建設現場, 説明: 排出事業者が決まっていないときの言い方（「県内一円の建設現場」など）は県で違う。県の型の注に書く }
  - { id: 運搬先, 種類: 聞き取り, 見出し: どこへ運ぶか（全体）, 例: 排出事業者の指定する処分施設, 説明: 決まっていないときの言い方は県で違う。県の型の注に書く }
  - { id: 営業範囲, 種類: 聞き取り, 見出し: 営業範囲（県名を並べる）, 例: 和歌山県、奈良県 }
  - { id: 時間, 種類: 聞き取り, 見出し: 収集運搬業務を行う時間, 例: ８時～17時（休憩　１時間） }
  - { id: 休業日, 種類: 聞き取り, 見出し: 休業日, 例: 日曜、祝祭日、年末年始 }
  - { id: 駐車場, 種類: 聞き取り, 見出し: 駐車場（車庫）の所在地, 例: 和歌山市みなと町1丁目2番3号 }
  - { id: 石綿の容器, 種類: 聞き取り, 見出し: 石綿含有産業廃棄物（汚泥以外）を入れる容器, 例: フレコンバッグ }
  - { id: 水銀使用製品の容器, 種類: 聞き取り, 見出し: 水銀使用製品産業廃棄物を入れる容器, 例: 水銀用容器 }

# ---- 品目ごとの口（控えで選んだ品目ごとに一組。様式の品目の表に一行ずつ入る） ----
品目ごと:
  - id: 品目ごとの運搬
    種類: 品目ごと
    見出し: 品目ごとの運搬量・性状・排出事業場・運搬先
    項目:
      - { id: 運搬量, 見出し: 運搬量（t/月 または m3/月）, 例: 20 t/月 }
      - { id: 性状, 見出し: 性状, 例: 固形状, 説明: 「固形状・泥状・液状」で足りる県と、どんな物かを具体的に書かせる県（秋田）がある。県の型の注に書く }
      - { id: 排出元, 見出し: 予定排出事業場の名称及び所在地, 例: 県内一円の建設現場, 説明: 決まっていないときの言い方は県の型の注 }
      - { id: 運搬先, 見出し: 予定運搬先の名称及び所在地, 例: ○○環境株式会社（○○県○○市…） }
      - { id: 積替保管場所, 見出し: 積替え又は保管を行う場所の所在地（積替保管「有」のときだけ）, 例: "" }

# ---- くり返しの口（何組か入れる） ----
くり返し:
  - id: 車両
    種類: くり返し
    見出し: 車両
    最大: 10
    項目:
      - { id: 車体の形状, 見出し: 車体の形状（車検証のとおり）, 例: ダンプ }
      - { id: 運ぶ品目, 見出し: その車両で運ぶ品目, 例: がれき類、金属くず }
      - { id: 登録番号, 見出し: 自動車登録番号又は車両番号, 例: 和歌山１００あ１２３４ }
      - { id: 最大積載量, 見出し: 最大積載量（kg）, 例: "3,800" }
      - { id: 所有者, 見出し: 所有者又は使用者, 例: 申請者 }
    # 写真（道具が様式の写真の面に貼る。和歌山の第6面など。画面でファイルを選ぶ。どこにも送らない）
    写真:
      - { id: 前面, 見出し: 前面の写真 }
      - { id: 側面, 見出し: 側面の写真 }
  - id: 容器
    種類: くり返し
    見出し: 運搬容器等
    最大: 6
    項目:
      - { id: 名称, 見出し: 容器等の名称, 例: フレコンバッグ }
      - { id: 用途, 見出し: 用途（何を入れるか）, 例: 石綿含有産業廃棄物の運搬 }
      - { id: 容量, 見出し: 容量, 例: 1m3/個 }
      - { id: 数, 見出し: 数, 例: 10個 }
    写真:
      - { id: 写真, 見出し: 容器の写真 }
  - id: 積替保管の場所
    種類: くり返し
    見出し: 積替え又は保管を行う場所（積替保管「有」のとき）
    最大: 3
    項目:
      - { id: 所在地, 見出し: 所在地 }
      - { id: 面積, 見出し: 面積 }
      - { id: 品目, 見出し: 積替え又は保管を行う産業廃棄物の種類 }
      - { id: 保管上限, 見出し: 積替えのための保管上限 }
      - { id: 高さ, 見出し: 積み上げることができる高さ }

# ---- 型の「欄」の id（様式の対応表の 文の欄 の id と同じにする） ----
# 様式の見出しが分かれている県は、分けた id を使う（山形は環境保全が (1)(2)(3) で別のマス）
欄の名前:
  - { id: 全体計画, 見出し: １．事業の全体計画 }
  - { id: 具体的な計画, 見出し: 収集運搬業務の具体的な計画（車両毎の用途・時間・休業日・従業員数） }
  - { id: 環境保全, 見出し: 環境保全措置の概要（一つのマスに (1)(2) をまとめて書く県） }
  - { id: 環境保全_運搬, 見出し: 環境保全措置の概要 (1) 運搬に際し講ずる措置（マスが分かれている県） }
  - { id: 環境保全_積替保管, 見出し: 環境保全措置の概要 (2) 積替え又は保管施設において講ずる措置（マスが分かれている県） }
  - { id: 積替保管の場所, 見出し: 申請書第1面の積替え又は保管を行う場所の欄 }

# ---- 道具が書かないもの（共通） ----
# 従業員数の内訳（人数の表）、役員、株主、資金、写真、図面。事業者から聞いて行政書士が書く
