  # 第5面「５．環境保全措置の概要 (1) 運搬に際し講ずる措置」（記載例 p32）。①〜④の見出しつき。
  # 余白の注「次の事項について記載すること。ア 廃棄物の飛散・流出の防止措置 イ 悪臭防止措置 ウ 騒音、振動の防止措置 エ その他生活環境の保全上支障を生ずるおそれのないように講ずる措置」。
  # 記載例は 40 字折りで 15 行あり、11 行に収まらない。四つの見出しと各見出しの一文目は守り、二文目以降を落とせるにした（落とすと 11 行ちょうど）。
  # 石綿・水銀使用製品の二文（各 2 行）は守らないので、あるときはその二文が入らず【要確認】に出る
  - id: 環境保全_運搬
    見出し: ５．環境保全措置の概要 (1) 運搬に際し講ずる措置
    注: 型の措置は記載例 p32 の会社の例です。泥状・液状の品目が無いなど、事業者の車両・容器・品目に合わない文は直すか消してください。余白の注のア（飛散・流出）イ（悪臭）ウ（騒音・振動）エ（その他）を全部書くこと。11 行に入らない分は道具が落とすので、落ちた文を短く書き直してください
    行:
      - { 字: "①　飛散及び流出防止", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　収集運搬の途中で廃棄物の飛散や漏えいを防止するため、泥状又は液状であるものはタンク車若しくは容器を用いて運搬する。", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　固形状のものはシートをかける又は容器を用いて運搬する。", 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　また、容器の転倒を防止するため、必要に応じてシートやロープで固定して運搬する。", 落とせる: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　石綿含有産業廃棄物の運搬は、破砕しないようかつ、その他の物と混合しないよう区分又は単独で運搬する。", 条件: 石綿あり, 出典: shuun_tebiki_all.pdf p32（「石綿含有産業廃棄物及び水銀使用製品産業廃棄物の運搬は…」を区分ごとに割った）, 写し: 組み替え }
      - { 字: "　水銀使用製品産業廃棄物の運搬は、破砕しないようかつ、その他の物と混合しないよう区分又は単独で運搬する。", 条件: 水銀使用製品あり, 出典: shuun_tebiki_all.pdf p32（同上）, 写し: 組み替え }
      - { 字: "②　悪臭防止対策", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　悪臭が発生するおそれのある汚泥等の運搬は、容器に入れて密封して運搬する。", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　また、必要に応じて消臭剤を常備し、使用する。", 落とせる: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　運搬車両は毎日清掃し、清潔の保持に努め、悪臭の発生を防止する。", 落とせる: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "③　騒音及び振動防止対策", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　運搬車両の整備、規定の積載量の遵守、関係法令の遵守、早朝深夜の作業回避を行うことにより、騒音・振動の防止に努める。", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "④　その他", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　生活環境保全上の支障が生じないように努める。", 守る: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "　苦情があった場合は、誠実に対応する。", 落とせる: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }

  # 第5面「(2) 積替え又は保管施設において講ずる措置」（記載例 p32。「無」は p44）。
  # 余白の注「ア 飛散及び流出 イ 地下浸透 ウ 悪臭発散 エ ねずみ・害虫 オ 汚水による公共用水域及び地下水の汚染 カ 石綿含有産業廃棄物又は水銀使用製品産業廃棄物とその他の物との混合防止 キ その他」。
  # 記載例の箇条のうち、品目と施設の造りが入る二行（汚泥は屋内の鋼鉄製専用タンクに…、がれき類は屋内に…）は会社ごとなので【要確認】一行に畳んだ。
  # 「(3) その他」のマスはこの型では書かない
  - id: 環境保全_積替保管
    見出し: ５．環境保全措置の概要 (2) 積替え又は保管施設において講ずる措置
    注: 積替保管「有」のとき、保管する品目ごとの保管の仕方（屋内か、床の材質、専用タンクか）は記載例 p32 の形で行政書士が書いてください。余白の注のイ（地下浸透）オ（汚水による公共用水域・地下水の汚染）カ（石綿含有・水銀使用製品とその他の物との混合防止）は記載例の箇条に無いので、該当すれば書き足してください
    行:
      - { 字: "　積替え保管は行わない。", 条件: 積替保管無, 出典: shuun_tebiki_all.pdf p44（特別管理産業廃棄物の記載例。様式は同じ）, 写し: まま }
      - { 字: "　【要確認：積替え又は保管施設において講ずる措置（積替え保管の有無を控えで選んでください）】", 続きの頭: 2, 条件: 積替保管未選択, 写し: なし }
      - { 字: "　積替え保管に関する保管基準を遵守するとともに以下の措置を講じる。", 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "・周囲に囲いを設け、見やすい場所に積替え保管場所であることの表示を行う。", 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "・【要確認：保管する品目ごとの飛散流出の防止措置（例：汚泥は屋内（鉄骨建屋、コンクリート床）の鋼鉄製専用タンクに保管し、飛散流出を防止する。）】", 続きの頭: 1, 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p32（品目と施設の造りが会社ごとなので、文は置かない）, 写し: なし }
      - { 字: "・受け入れ量保管の高さ、範囲、容積を超えた積替え保管はしない。", 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "・保管場所に搬入した産業廃棄物は、性状が変化しないうちに、かつ７日以内に搬出する。", 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "・終業時に保管施設の清掃及び点検を行い、ねずみ等の発生防止、悪臭及び飛散の防止に努める。また、保管施設の破損等を発見した場合は速やかに補修を行う。", 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
      - { 字: "・苦情があった場合は、誠実に対応する。", 条件: 積替保管有, 落とせる: true, 出典: shuun_tebiki_all.pdf p32, 写し: まま }
