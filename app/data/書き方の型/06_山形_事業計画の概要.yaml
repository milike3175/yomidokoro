      - { 字: "（１）運搬業務の受託及び運搬計画", 落とせる: true, 出典: shuun_tebiki_all.pdf p31, 写し: まま }
      - { 字: "　①　排出者から産業廃棄物の収集運搬を受託しようとするときは、排出元、種類、性状等を記載した書面・写真等の提出を求めるなどにより、運搬できる性状のものであること、当社の運搬能力を超えない範囲であること、許可の範囲内であること等、処理できることを確認のうえ委託契約を締結する。", 落とせる: true, 出典: shuun_tebiki_all.pdf p31, 写し: まま }
