# 書き方の型：山形県 産業廃棄物収集運搬業許可申請の「事業計画の概要を記載した書類」（申請書とは別の Word、keikakuh29.docx）の文。
# 公開してよいデータ（県の手引きの記載例を写したもので、事業者の情報は入っていない）。
#
# 作り方（2026-11-05 ジョブズの手伝い役（Fable））：山形県の手引き shuun_tebiki_all.pdf（手引き/06_山形県/）の記載例 p28〜p32
# （産業廃棄物収集運搬業の記載例。第1面〜第5面）と、積替保管「無」の文だけは同じ手引きの特別管理産業廃棄物の記載例 p43〜p44 から取った。
# 手引き p14「事業計画の概要を記載した書類」の留意事項、p28・p29・p32 の余白の注意書きは、差し込み口の 説明 と欄の 注 に写した。
# 白紙の様式（npm run 様式を診断 -- keikakuh29.docx --詳しく）でマスの空の段落を数え、行数は 全体計画 11・具体的な計画 25・環境保全(1) 11・(2) 11、一行 40 字と決めた（ジョブズ）。
#
# 読んで決めたこと：
#   - 全体計画（p28）は一段落の文章。「{排出元}において発生する{品目}を、排出事業者との契約に基づき{車両の種類}を用いて収集運搬し、{運搬先}に搬入する。」の形。
#     営業範囲の行は無い（「山形県内全域」は排出元の中に入る）。石綿・水銀使用製品は「なお、…を含む。」と後ろに添える。積替え保管を行う品目は「…については、積替え保管を行う。」
#   - 具体的な計画（p31）は「収集運搬の方法」の下に（１）受託と運搬計画 ①〜⑤（どの会社でも同じ決まり文句）、（２）車両及び容器（品目ごとに一行。車両ごとではない）、
#     （３）積替え保管、（４）時間と休業日。従業員数の内訳はマスの下の表で、道具は書かない
#   - 環境保全（p32）は (1) 運搬 と (2) 積替え又は保管施設 が別のマス。(1) は ①飛散及び流出防止 ②悪臭 ③騒音及び振動 ④その他 の見出しつき（余白の注「ア〜エ について記載すること」）
#   - 記載例の数字（運搬量・人数・台数）・社名・住所は型に入れない。会社ごとに変わる所だけを空きにし、決まり文句は「まま」で写す
#   - 条件は一行に一つしか付かないので、記載例の「水銀使用製品産業廃棄物、石綿含有産業廃棄物を含む」「石綿含有産業廃棄物及び水銀使用製品産業廃棄物の運搬は…」は二行に割った（写し：組み替え）
#   - 記載例は 11 行・25 行のマスに収まらない（(1) 運搬の措置は 40 字折りで 15 行、具体的な計画は 30 行超）。
#     守る：（２）車両及び容器〜（４）時間・休業日（会社ごとに違う所）、環境保全 (1) の四つの見出しと一文目。落とせる：空けた行、見出し「収集運搬の方法」、各見出しの二文目以降。
#     足りない分は道具が下から落として【要確認】に出す（具体的な計画なら（１）の決まり文句が⑤から、環境保全 (1) なら石綿・水銀使用製品の二文）
#
# 行の書き方（和歌山の型と同じ）：
#   字：様式に書く文。{差し込み口の id} を差し込む。"" は空けておく行
#   続きの頭：一行に収まらず次の段落へ送るとき、2行目以降の頭に置く全角空白の数。山形の記載例は折り返しが左詰めなので、ほとんど付けない
#   条件：控えの選びで出すかどうか（石綿あり・水銀使用製品あり・水銀含有ばいじん等あり・積替保管無・積替保管有・積替保管未選択）
#   落とせる：欄の行が足りないとき、先に落とす行。守る：欄の行が足りなくても必ず書く行
#   出典：基づいた資料とページ（shuun_tebiki_all.pdf の p は PDF のページ。手引きの印刷のページ番号は 4 少ない）
#   写し：まま＝記載例の文をそのまま／一部＝差し込み口のほかは記載例のまま／組み替え＝記載例の言い回しを道具が組み替えた／なし＝記載例に文が無く、道具が【要確認】を置いた
# 差し込み口が空なら、様式に「【要確認：見出し】」を残す。道具は数字や事実を作らない。
sha256: 3b179fcca84935d893fbd43a26bf36f69bf3629e8a8a378cecf4940aeb94dcc7
名前: 事業計画の概要を記載した書類（収集運搬業）
県名: 山形県
資料:
  手引き: shuun_tebiki_all.pdf（山形県 収集運搬業許可申請の手引き 全文。記載例は p28〜p32。積替保管「無」の文は特別管理産業廃棄物の記載例 p43〜p44）

差し込み口:
  - id: 品目の並び
    種類: 自動
    見出し: 取り扱う品目の並び
    説明: 控えの品目から作る。山形の記載例 p28 は「汚泥、廃プラスチック類、金属くず、ガラスくず・コンクリートくず及び陶磁器くず並びにがれき類」と品目を全部並べ、石綿・水銀使用製品は品目に添えず「なお、…を含む。」と後ろに書く
  - id: 品目の言い方
    種類: 聞き取り
    見出し: 品目のまとめた言い方
    空なら: 品目の並び
    例: 建設系廃棄物
    説明: 空なら、控えの品目を並べて書きます。山形の記載例 p28 は品目を全部並べています（まとめた言い方は使っていません）
  - id: 排出元
    種類: 聞き取り
    見出し: どこから出る廃棄物か（全体）
    例: 山形県内全域の店舗、解体現場、工場
    説明: 記載例 p28「山形県内全域の店舗、解体現場、工場において発生する」。営業範囲は別に書かず、この中に入れます
  - id: 運搬先
    種類: 聞き取り
    見出し: どこへ運ぶか（全体）
    例: 排出事業者の指定する処分施設等
    説明: 記載例 p28「排出事業者の指定する処分施設等に搬入する」。p28 の余白の注「取り扱うことができる運搬先（処分場）であること」「石綿含有産業廃棄物を処理できるのは無害化処理施設、廃石綿等の溶融施設、最終処分場に限られていること」「水銀使用製品産業廃棄物を処分できる事業場は限られていること」
  - id: 06_車両の種類
    種類: 聞き取り
    見出し: 収集運搬に用いる車両の種類（車体の形状を並べる）
    例: キャブオーバ、ダンプ、脱着装置付きコンテナ専用車及びタンク車
    説明: 記載例 p28「キャブオーバ、ダンプ、脱着装置付きコンテナ専用車及びタンク車を用いて」。第2面の運搬車両一覧の車体の形状（p29 の余白の注「車検証の『車体の形状』の欄を記入」）と同じ言い方で、種類ごとに一つずつ並べてください
  - id: 06_積替保管の品目
    種類: 聞き取り
    見出し: 積替え保管を行う品目（積替保管「有」のときだけ）
    例: 汚泥及びがれき類
    説明: 記載例 p28「汚泥及びがれき類については、積替え保管を行う。」、p31（３）「汚泥、がれき類については、積替え保管を行う場合は…」。p28 の余白の注「山形市内の積替え保管は山形県知事の許可対象ではないため、留意すること」
  - id: 06_品目ごとの運び方
    種類: 品目ごと
    見出し: 品目ごとの運び方（容器と車両）
    説明: 第4面（２）車両及び容器に、品目ごとに一行で書きます（記載例 p31）。「容器に入れて／荷台に積み、シートをかけて」と「どの車両で運搬」を一続きで。空けた所は【要確認】を残します
    項目:
      - { id: 運び方, 見出し: 容器・積み方と車両, 例: ドラム缶（蓋付き）に入れてキャブオーバで運搬 }
  - id: 時間
    種類: 聞き取り
    見出し: 収集運搬業務を行う時間
    例: ８：００～１７：００（緊急の場合を除く）
    説明: 記載例 p31「８：００～１７：００（緊急の場合を除く）」。「（緊急の場合を除く）」を付けるかは会社ごとに決めてください
  - id: 休業日
    種類: 聞き取り
    見出し: 休業日
    例: 日曜日及び祝祭日（緊急の場合を除く）
    説明: 記載例 p31「日曜日及び祝祭日　（緊急の場合を除く）」

  # ---- ここから下は、型の行では使わない口。様式の対応表側が品目の表（第1面の２）・運搬車両一覧（第2面(1)）・運搬容器等（第2面(2)）・駐車場の所在地（第2面）に
  #      この口の値を書くので、画面に入力欄を出すために型に置く（2026-11-05 ジョブズの頼み）。id・見出し・例は _共通の差し込み口.yaml のまま ----
  - id: 品目ごとの運搬
    種類: 品目ごと
    見出し: 品目ごとの運搬量・性状・排出事業場・運搬先
    説明: 第1面の２の表に、品目ごとに一行で書きます（記載例 p28）。石綿含有は「含む」「除く」で行を分け、水銀使用製品産業廃棄物は対象の品目をまとめた一行にします
    項目:
      - { id: 運搬量, 見出し: 運搬量（t/月 または m3/月）, 例: 20 t/月 }
      - { id: 性状, 見出し: 性状, 例: 固形状, 説明: 記載例 p28 は「泥状」「固形状」 }
      - { id: 排出元, 見出し: 予定排出事業場の名称及び所在地, 例: 県内一円建設現場, 説明: p28 の余白の注「建設現場など具体的に記載し、特定できない場合は県内一円事業場等でも可」「産業廃棄物が排出される業種・事業場であること」「一般廃棄物を含まないこと」。決まっているときは名称と所在地 }
      - { id: 運搬先, 見出し: 予定運搬先の名称及び所在地, 例: ○○環境株式会社（○○県○○市…）, 説明: p28 の余白の注「取り扱うことができる運搬先（処分場）であること」「石綿含有産業廃棄物を処理できるのは無害化処理施設、廃石綿等の溶融施設、最終処分場に限られていること」「水銀使用製品産業廃棄物を処分できる事業場は限られていること」 }
      - { id: 積替保管場所, 見出し: 積替え又は保管を行う場所の所在地（積替保管「有」のときだけ）, 例: "", 説明: p28 の余白の注「山形市内の積替え保管は山形県知事の許可対象ではないため、留意すること」 }
  - id: 車両
    種類: くり返し
    見出し: 車両
    最大: 10
    説明: 第2面 (1) 運搬車両一覧に一行ずつ書きます（記載例 p29）。余白の注「車検証の『車体の形状』の欄を記入」「車検証の『最大積載量』を記入」「車検証の『所有者又は使用者』を記入。申請者が所有者又は使用者でない場合は、所有者を記載」
    項目:
      - { id: 車体の形状, 見出し: 車体の形状（車検証のとおり）, 例: ダンプ }
      - { id: 運ぶ品目, 見出し: その車両で運ぶ品目, 例: がれき類、金属くず }
      - { id: 登録番号, 見出し: 自動車登録番号又は車両番号, 例: 和歌山１００あ１２３４ }
      - { id: 最大積載量, 見出し: 最大積載量（kg）, 例: "3,800" }
      - { id: 所有者, 見出し: 所有者又は使用者, 例: 申請者 }
  - id: 容器
    種類: くり返し
    見出し: 運搬容器等
    最大: 3
    説明: 第2面 (2) その他の運搬施設の概要に一行ずつ書きます（記載例 p29「ドラム缶（蓋付き）／汚泥の運搬／200L/個／２０本」）。数は備考の列
    項目:
      - { id: 名称, 見出し: 容器等の名称, 例: フレコンバッグ }
      - { id: 用途, 見出し: 用途（何を入れるか）, 例: 石綿含有産業廃棄物の運搬 }
      - { id: 容量, 見出し: 容量, 例: 1m3/個 }
      - { id: 数, 見出し: 数, 例: 10個 }
  - id: 駐車場
    種類: 聞き取り
    見出し: 駐車場（車庫）の所在地
    例: 和歌山市みなと町1丁目2番3号
    説明: 第2面の「駐車場の所在地」（記載例 p29）。余白の注「申請書に記載した事業場所在地と整合性がとれていること」

欄:
  # 第1面「１．事業の全体計画」（記載例 p28）。一段落の文章。頭を全角一字下げ、折り返しは左詰め。
  # 記載例は品目を全部並べて「なお、水銀使用製品産業廃棄物、石綿含有産業廃棄物を含む。」と添え、積替え保管を行う品目を最後に書く。営業範囲の行は無い。
  # 積替保管「無」のときの文は記載例（p28・p40）に無いので作らない
  - id: 全体計画
    見出し: １．事業の全体計画
    注: 記載例 p28 は品目を全部並べ、石綿含有・水銀使用製品は「なお、…を含む。」と後ろに添えています。石綿と水銀使用製品の両方があるときは「なお」が二度出るので、記載例のように「なお、水銀使用製品産業廃棄物、石綿含有産業廃棄物を含む。」の一文に直してください。p28 の余白の注「一般廃棄物を含まないこと」「産業廃棄物が排出される業種・事業場であること」
    行:
      - { 字: "　{排出元}において発生する{品目の言い方}を、排出事業者との契約に基づき{06_車両の種類}を用いて収集運搬し、{運搬先}に搬入する。", 出典: shuun_tebiki_all.pdf p28, 写し: 一部 }
      - { 字: "　なお、石綿含有産業廃棄物を含む。", 条件: 石綿あり, 出典: shuun_tebiki_all.pdf p28（「なお、水銀使用製品産業廃棄物、石綿含有産業廃棄物を含む。」を区分ごとに割った）, 写し: 組み替え }
      - { 字: "　なお、水銀使用製品産業廃棄物を含む。", 条件: 水銀使用製品あり, 出典: shuun_tebiki_all.pdf p28（同上）, 写し: 組み替え }
      - { 字: "　なお、水銀含有ばいじん等を含む。", 条件: 水銀含有ばいじん等あり, 出典: shuun_tebiki_all.pdf p28 の「なお、…を含む。」の形に、手引き p13（水銀含有ばいじん等の取扱いの有無を記入すること）の区分を当てた。記載例に文は無い, 写し: 組み替え }
      - { 字: "　{06_積替保管の品目}については、積替え保管を行う。", 条件: 積替保管有, 出典: shuun_tebiki_all.pdf p28, 写し: 一部 }

