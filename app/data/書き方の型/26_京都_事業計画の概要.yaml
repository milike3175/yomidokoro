差し込み口:
  - id: 品目の並び
    種類: 自動
    見出し: 取り扱う品目の並び
    説明: 控えの品目から作る。全体計画の図の矢印の上に並べる（記入例 p24「木くず、がれき類／建設系混合産業廃棄物」）
  - id: 26_営業日
    種類: 聞き取り
    見出し: 営業日（曜日）
    例: 月～土曜日
    説明: 記入例 p30「(1) 営業日：月～土曜日（8:00～16:00）」
  - id: 時間
    種類: 聞き取り
    見出し: 収集運搬業務を行う時間
    例: 8:00～16:00
    説明: 記入例 p30「（8:00～16:00）」
  - id: 休業日
    種類: 聞き取り
    見出し: 休業日
    例: 日曜日及び祝祭日
    説明: 記入例 p30「休業日：日曜日及び祝祭日」
  - id: 26_引き取りの頻度
    種類: 聞き取り
    見出し: 各排出事業場に引き取りに行く頻度
    例: 1回/週
    説明: 記入例 p30「各排出事業場に1回/週の頻度で引き取りに行き」。余白の注「運搬頻度は第1面の事業計画に合わせて」
  - id: 品目ごとの運搬
    種類: 品目ごと
    見出し: 品目ごとの運搬量・性状・排出事業場・運搬先
    説明: 第1面の２の表に、品目ごとに一行で書きます（記入例 p24〜p27）。排出事業場が工事現場などで一定しないときは「［排出現場：京都府内］」、運搬先は代表的な所を書いて末尾に「他」（余白の注）
    項目:
      - { id: 運搬量, 見出し: 運搬量（t/月 または m3/月）, 例: 10 t/月 }
      - { id: 性状, 見出し: 性状, 例: 固形物, 説明: 記入例は「混合 固形物」「分別済 固形物」「泥状」 }
      - { id: 排出元, 見出し: 予定排出事業場の名称及び所在地, 例: ○○建設㈱（京都府亀岡市）［排出現場：京都府内］ }
      - { id: 積替保管場所, 見出し: 積替え又は保管を行う場所の所在地（行わないときは空のまま）, 例: "" }
      - { id: 運搬先, 見出し: 予定運搬先の名称及び所在地（末尾に「他」）, 例: ㈱☆☆産業（京都市伏見区）他, 説明: 余白の注「委託先の許可等が適正であることは申請者においても確認しておく」 }
  - id: 車両
    種類: くり返し
    見出し: 車両
    最大: 5
    説明: 第2面の運搬車両一覧（記入例 p28。「車両の形状」と、次の行に括弧書きで会社での呼び方）と、第4面の車両ごとの用途（「・４ｔダンプ ・・・ （直接積載）建設系混合産業廃棄物」）に書きます。呼び方は第4面と一致させる（余白の注）
    項目:
      - { id: 車体の形状, 見出し: 車両の形状（車検証のとおり）, 例: ダンプ }
      - { id: 26_車両の名称, 見出し: 会社での呼び方（括弧つきで）, 例: （４ｔダンプ） }
      - { id: 登録番号, 見出し: 自動車登録番号又は車両番号（車検証のとおり）, 例: 京都１２あ１２３４ }
      - { id: 最大積載量, 見出し: 最大積載量（kg）, 例: "3,500" }
      - { id: 所有者, 見出し: 所有者又は使用者, 例: 申請者 }
      - { id: 26_積み方, 見出し: 積み方（直接積載／運搬容器）, 例: 直接積載 }
      - { id: 運ぶ品目, 見出し: その車両で運ぶ品目, 例: 建設系混合産業廃棄物（木くず、がれき類を除く） }
    写真:
      - { id: 前面, 見出し: 前面の写真 }
      - { id: 側面, 見出し: 側面の写真 }
  - id: 容器
    種類: くり返し
    見出し: 運搬容器等
    最大: 4
    説明: 第2面の運搬容器等（記入例 p28「鉄製コンテナ／建設系混合産業廃棄物 石綿含有産業廃棄物／2 m3」）と、第7面の写真の面に書きます（2つまで）
    項目:
      - { id: 名称, 見出し: 容器等の名称, 例: 鉄製コンテナ }
      - { id: 用途, 見出し: 用途（収納する産業廃棄物の種類）, 例: 建設系混合産業廃棄物 }
      - { id: 容量, 見出し: 容量, 例: 2 m3 }
      - { id: 数, 見出し: 備考（数など）, 例: "" }
    写真:
      - { id: 写真, 見出し: 容器の写真 }
  - id: 駐車場
    種類: 聞き取り
    見出し: 駐車場（車庫）の所在地
    例: 京都府○○市◇◇町××番地
    説明: 第2面の「駐車場の所在地」（記入例 p28）と、申請書第1面の「事業場」に書きます
  - id: 26_品目ごとの措置
    種類: 品目ごと
    見出し: 品目ごとの運び方（環境保全措置）
    説明: 第5面 (1) に、品目ごとに「・〇〇の運搬に当たっては、〜、産業廃棄物が飛散又は流出しないように運搬する。」と書きます（記入例 p31）。空けた所は【要確認】を残します
    項目:
      - { id: 運び方, 見出し: 積み方と固定のしかた, 例: 荷台に直接積載し、シートがけして }

