#
# 読んで決めたこと：
#   - 全体計画（p24）は一文「排出事業者が処分を委託した処分業者のところまで、申請者が積替えせず直接運搬する。」と、排出事業場 → 処分業者 の図。図は対応表の 図の場所 が Word の図形で描く（2026-11-06 夜）。
#     運搬先が他の収集運搬業者の積替保管施設のときは p27 の二文目「排出事業者が指定した収集運搬業者（積替保管）まで、…」を足す（会社ごとなので要確認）
#   - 具体的な計画（p30）は (1) 営業日・休業日、(2) 収集運搬計画（どの会社でも同じ決まり文句。石綿・水銀のときだけの一文あり）、(3) 車両ごとの用途（「・４ｔダンプ ・・・ （直接積載）建設系混合産業廃棄物」）。従業員数の内訳はマスの下の表
#   - 環境保全（p31）は (1) 運搬に際し講ずる措置（品目のまとまりごとに「〜の運搬に当たっては、〜に入れ、荷台に固定し、シートがけして、産業廃棄物が飛散又は流出しないように運搬する。」）、
#     石綿の二文、水銀使用製品の一文（扱うときだけ。余白の注）、(2) 積替え又は保管施設（該当なし）、(3) その他（該当なし）
#   - 記載例の数字（運搬量・人数・台数）・社名・住所は型に入れない
#
# 行の書き方（和歌山・山形・愛知の型と同じ）。{差し込み口の id} を差し込む。"" は空けておく行。条件は 中身の印 の鍵（石綿あり・水銀使用製品あり・石綿か水銀あり・積替保管無・積替保管有・積替保管未選択）
