# 書き方の型：和歌山県 産業廃棄物収集運搬業許可申請（様式第六号・新規）の「事業計画の概要」などの文。
# 公開してよいデータ（県の記載例・手引きの書き方を写したもので、事業者の情報は入っていない）。
#
# 作り方（2026-11-04 タクミ）：和歌山の様式記載例 yousiki_kisaire.pdf・申請書記載例 shinseisho_kisairei.pdf・手引き shinseitebiki.pdf
# （手引き/30_和歌山県/）を読み、文の組み立て・順番・言い回しを型にした。型の文はここに固定し、画面は差し込みをブラウザの中でするだけ。
# 事業者の情報は Claude に送らない。
#
# 行の書き方：
#   字：様式に書く文。{差し込み口の id} を差し込む。"" は空けておく行
#   続きの頭：一行に収まらず次の段落へ送るとき、2行目以降の頭に置く全角空白の数（「・」の後ろにそろえる）
#   条件：控えの選びで出すかどうか（石綿あり・石綿の汚泥・石綿の汚泥以外・水銀使用製品あり・水銀含有ばいじん等あり・積替保管無・積替保管無でない）
#   落とせる：欄の行が足りないとき、先に落とす行
#   出典：基づいた資料とページ
#   写し：まま＝記載例の文をそのまま写した／一部＝差し込み口のほかは記載例の文のまま／組み替え＝記載例の言い回しを道具が品目ごとなどに組み替えた／なし＝記載例に文が無く、道具が【要確認】を置いた
#   形：一つの欄に書き方の形を二つ以上持つとき。初めは並びの最初の形（県の記載例の形）。画面で選べる
# 差し込み口が空なら、様式に「【要確認：見出し】」を残す。道具は数字や事実を作らない。
sha256: 7a17dc195b500374cfd87acb9e0f364e8e3b5a1da8f94c1ff078c66572b0f63e
名前: 産業廃棄物収集運搬業許可申請書（様式第六号・新規）の事業計画の概要
県名: 和歌山県
資料:
  様式記載例: yousiki_kisaire.pdf（和歌山県 産業廃棄物収集運搬業の様式記載例。事業計画の概要 第1面〜第10面）
  申請書記載例: shinseisho_kisairei.pdf（和歌山県 収集運搬業許可申請書の記載例）
  手引き: shinseitebiki.pdf（和歌山県 産業廃棄物収集運搬業許可申請の手引き）

差し込み口:
  - id: 品目の並び
    種類: 自動
    見出し: 取り扱う品目の並び
    説明: 控えの品目から作る。石綿・水銀含有ばいじん等を含む品目は「（…を含む）」を添え、水銀使用製品産業廃棄物は最後に置く（様式記載例 p1 記載例②「汚泥（水銀含有ばいじん等を含む）及び水銀使用製品産業廃棄物」の形）
  - id: 品目の言い方
    種類: 聞き取り
    見出し: 品目のまとめた言い方
    空なら: 品目の並び
    例: 建設系廃棄物
    説明: 空なら、控えの品目を並べて書きます。記載例①は「建設系廃棄物」とまとめて書いています（様式記載例 p1）
  - id: 排出元
    種類: 聞き取り
    見出し: どこから出る廃棄物か
    例: 和歌山県内の建設現場
    説明: 様式記載例 p1 記載例①「和歌山県内の建設現場」、記載例②「○○工場」
  - id: 運搬先
    種類: 聞き取り
    見出し: どこへ運ぶか
    例: 中間処理場又は最終処分場
    説明: 様式記載例 p1 記載例①「中間処理場又は最終処分場」、他社の積替保管場所へ運ぶときは記載例②「（株）△△△の積替保管場所」
  - id: 品目ごとの運搬
    種類: 品目ごと
    見出し: 品目ごとの排出元と運搬先
    説明: 全体計画を「品目ごとの箇条書き」で書くときだけ使います。控えで選んだ品目ごとに入れてください。空けた所は【要確認】を残します
    項目:
      - { id: 排出元, 見出し: どこから出る廃棄物か, 例: 和歌山県内の建設現場 }
      - { id: 運搬先, 見出し: どこへ運ぶか, 例: 中間処理場又は最終処分場 }
  - id: 営業範囲
    種類: 聞き取り
    見出し: 営業範囲（県名を並べる）
    例: 和歌山県、○○県、××県
    説明: 様式記載例 p1「和歌山県、○○県、××県」
  - id: 車両
    種類: くり返し
    見出し: 車両ごとの用途
    最大: 10
    説明: 第2面の運搬車両一覧の車体の形状とそろえてください（様式記載例 p3〜p4）
    項目:
      - { id: 車体の形状, 見出し: 車体の形状, 例: 脱着装置付コンテナ専用車 }
      - { id: 運ぶ品目, 見出し: その車両で運ぶ品目, 例: すべての許可品目 }
  - id: 積替保管の場所
    種類: くり返し
    見出し: 積替え又は保管を行う場所（積替保管「有」のとき）
    最大: 3
    説明: 和歌山の記載例に積替保管ありの例が無いので、様式の見出しの言葉（所在地及び面積、産業廃棄物の種類、保管上限、積み上げることができる高さ）で行を立てています。空けた所は【要確認】を残します
    項目:
      - { id: 所在地, 見出し: 所在地 }
      - { id: 面積, 見出し: 面積 }
      - { id: 品目, 見出し: 積替え又は保管を行う産業廃棄物の種類 }
      - { id: 保管上限, 見出し: 積替えのための保管上限 }
      - { id: 高さ, 見出し: 積み上げることができる高さ }
  - id: 時間
    種類: 聞き取り
    見出し: 収集運搬業務を行う時間
    例: ９時～17時（休憩　１時間）
    説明: 様式記載例 p4「９時～17時（休憩 １時間）」
  - id: 休業日
    種類: 聞き取り
    見出し: 休業日
    例: 日曜、祝祭日、年末年始（12月28日～１月３日）
    説明: 様式記載例 p4
  - id: 石綿の容器
    種類: 聞き取り
    見出し: 石綿含有産業廃棄物（汚泥以外）を入れる容器
    例: フレコンバッグ
    説明: 第2面の運搬容器・第7面の写真の「容器等の名称」とそろえてください（様式記載例 p3・p5・p7）
  - id: 水銀使用製品の容器
    種類: 聞き取り
    見出し: 水銀使用製品産業廃棄物を入れる容器
    例: 水銀用容器
    説明: 第2面の運搬容器・第7面の写真の「容器等の名称」とそろえてください（様式記載例 p3・p5）

欄:
  # 様式記載例 p1「１．事業の全体計画」。文章（箇条書き）で、①事業の概要 ②営業範囲 に分ける。図は無い。
  # ①②の分け方は記載例にだけあり、空の様式には無い。「（記載例①…）」の見出しは写さない
  # 書き方の形は二つ（2026-11-04 夜 みゆき「1文にまとめすぎている感じあり。品目ごとに箇条書きの方がいいかも。ただし…和歌山の記載例がこういった感じなら、あとは行政書士の好みの書き方」）
  - id: 全体計画
    見出し: 事業計画の概要（１．事業の全体計画）
    形の説明: 県の記載例の形が初めに選ばれています。行政書士の好みで、品目ごとの箇条書きにもできます
    形:
      - id: 記載例
        見出し: 記載例の形（文章）
        説明: 和歌山の様式記載例 p1 の形です。全部の品目を一つの文にまとめます
        行:
          - { 字: "　①　事業の概要", 出典: yousiki_kisaire.pdf p1, 写し: まま }
          - { 字: "　　・主に、{排出元}から出る{品目の言い方}を収集し、{運搬先}に運搬する。", 続きの頭: 3, 出典: yousiki_kisaire.pdf p1（記載例①②）, 写し: 一部 }
          - { 字: "", 落とせる: true }
          - { 字: "　②　営業範囲", 出典: yousiki_kisaire.pdf p1, 写し: まま }
          - { 字: "　　・{営業範囲}", 続きの頭: 3, 出典: yousiki_kisaire.pdf p1, 写し: 一部 }
      # 和歌山の記載例に品目ごとの箇条書きは無い。記載例①②の「…から出る…を収集し、…に運搬する」を品目ごとの行に組み替えた。
      # 大阪の記載例（様式第六号の二 p49「・大阪府内の〇〇で発生する〇〇を排出者指定の処分業者に運搬する。」）も1行1文の箇条書き
      - id: 箇条書き
        見出し: 品目ごとの箇条書き
        説明: 品目ごとに1行（・品目：排出元から収集し、運搬先に運搬する。）で書きます。和歌山の記載例に無い形なので、行政書士の好みで使ってください
        行:
          - { 字: "　①　事業の概要", 出典: yousiki_kisaire.pdf p1, 写し: まま }
          - くり返し: 品目ごとの運搬
            字: ""
            行:
              - { 字: "　　・{品目}：{排出元}から収集し、{運搬先}に運搬する。", 続きの頭: 3, 出典: yousiki_kisaire.pdf p1（記載例①②の言い回しを品目ごとに組み替えた）, 写し: 組み替え }
          - { 字: "", 落とせる: true }
          - { 字: "　②　営業範囲", 出典: yousiki_kisaire.pdf p1, 写し: まま }
          - { 字: "　　・{営業範囲}", 続きの頭: 3, 出典: yousiki_kisaire.pdf p1, 写し: 一部 }

  # 申請書第1面の積替保管の場所の欄。無は申請書記載例 p1 の「該当なし」。有は記載例が無いので、様式の見出しの言葉で行を立てる（写し：なし）
  - id: 積替保管の場所
    見出し: 第1面 積替え又は保管を行う場所の欄
    行:
      - { 字: 該当なし, 条件: 積替保管無, 出典: shinseisho_kisairei.pdf p1, 写し: まま }
      - くり返し: 積替保管の場所
        条件: 積替保管有
        字: ""
        写し: なし
        空なら: "【要確認：積替え又は保管を行う場所（和歌山の記載例に積替保管ありの例がありません）】"
        行:
          - { 字: "{番号}所在地：{所在地}", 続きの頭: 1, 写し: なし }
          - { 字: "　面積：{面積}", 続きの頭: 1, 写し: なし }
          - { 字: "　産業廃棄物の種類：{品目}", 続きの頭: 1, 写し: なし }
          - { 字: "　保管上限：{保管上限}", 続きの頭: 1, 写し: なし }
          - { 字: "　積み上げることができる高さ：{高さ}", 続きの頭: 1, 写し: なし }

  # 様式記載例 p4「４．収集運搬業務の具体的な計画」。(1)車両毎の用途 (2)時間 (3)休業日 の順。従業員数は欄の下の表（道具は書かない）
  - id: 具体的な計画
    見出し: ４．収集運搬業務の具体的な計画
    注: 従業員数の内訳（この欄の下の表）は道具では書きません。日付を明記し、兼務している人はその人数をカッコ書きで書いてください（様式記載例 p4）
    行:
      - { 字: "(1)車両毎の用途", 出典: yousiki_kisaire.pdf p4, 写し: まま }
      - くり返し: 車両
        字: ""
        出典: yousiki_kisaire.pdf p4
        写し: 一部
        空なら: "　【要確認：車両ごとの用途（車体の形状と、その車両で運ぶ品目）】"
        行:
          - { 字: "　{番号}{車体の形状}", 出典: yousiki_kisaire.pdf p4, 写し: 一部 }
          - { 字: "　　　{運ぶ品目}", 続きの頭: 3, 出典: yousiki_kisaire.pdf p4, 写し: 一部 }
      - { 字: "", 落とせる: true }
      - { 字: "(2)収集運搬業務を行う時間", 出典: yousiki_kisaire.pdf p4, 写し: まま }
      - { 字: "　　　{時間}", 続きの頭: 3, 出典: yousiki_kisaire.pdf p4, 写し: 一部 }
      - { 字: "", 落とせる: true }
      - { 字: "(3)休業日", 出典: yousiki_kisaire.pdf p4, 写し: まま }
      - { 字: "　　{休業日}", 続きの頭: 2, 出典: yousiki_kisaire.pdf p4, 写し: 一部 }

  # 様式記載例 p5「５．環境保全措置の概要」。(1)運搬に際し講ずる措置 (2)積替施設又は保管施設において講ずる措置。1行の箇条書き。悪臭・騒音の例は無い
  - id: 環境保全
    見出し: ５．環境保全措置の概要
    注: 型の措置は記載例の会社の例です。事業者の車両・容器・品目に合わない行は直すか消してください。容器の名称は第2面・第7面とそろえてください（様式記載例 p3・p7）
    行:
      - { 字: "(1) 運搬に際し講ずる措置", 出典: yousiki_kisaire.pdf p5, 写し: まま }
      - { 字: "・飛散防止のため荷台にはシートがけを行う。", 続きの頭: 1, 出典: yousiki_kisaire.pdf p5, 写し: まま }
      - { 字: "・第２面に記載のとおり容器を使用して、飛散、流出しないように運搬する。", 続きの頭: 1, 出典: yousiki_kisaire.pdf p5, 写し: まま }
      - { 字: "・石綿含有産業廃棄物（汚泥除く）は他の廃棄物と混ざらないように{石綿の容器}に入れて、破砕しないように運搬する。", 続きの頭: 1, 条件: 石綿の汚泥以外, 出典: yousiki_kisaire.pdf p5, 写し: 一部 }
      - { 字: "・石綿含有産業廃棄物（汚泥）は耐水性プラスチック袋に二重梱包して運搬する。", 続きの頭: 1, 条件: 石綿の汚泥, 出典: yousiki_kisaire.pdf p5、shinseitebiki.pdf p4（耐水性プラスチック袋等により二重で梱包）, 写し: まま }
      - { 字: "・水銀使用製品産業廃棄物は、{水銀使用製品の容器}を用いて、破砕しないように運搬する。", 続きの頭: 1, 条件: 水銀使用製品あり, 出典: yousiki_kisaire.pdf p5, 写し: 一部 }
      - { 字: "・【要確認：水銀含有ばいじん等の運搬の措置（和歌山の記載例に文がありません）】", 続きの頭: 1, 条件: 水銀含有ばいじん等あり, 写し: なし }
      - { 字: "・関係法令や国のガイドラインやマニュアルを遵守する。", 続きの頭: 1, 出典: yousiki_kisaire.pdf p5, 写し: まま }
      - { 字: "", 落とせる: true }
      - { 字: "(2)積替施設又は保管施設において講ずる措置", 出典: yousiki_kisaire.pdf p5, 写し: まま }
      - { 字: "　　積替え及び保管は行わない。", 条件: 積替保管無, 出典: yousiki_kisaire.pdf p5, 写し: まま }
      - { 字: "　　【要確認：和歌山の記載例に積替保管ありの文がありません】", 続きの頭: 2, 条件: 積替保管有, 写し: なし }
      - { 字: "　　【要確認：積替施設又は保管施設において講ずる措置】", 続きの頭: 2, 条件: 積替保管未選択, 写し: なし }
