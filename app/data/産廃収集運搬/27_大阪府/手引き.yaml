      印字ページ: 14
      引用: 積み降ろしを行う政令市又は都道府県の許可が必要であり、通過する自治体の許可は不要です。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 新規
      - 更新
      - 変更許可
