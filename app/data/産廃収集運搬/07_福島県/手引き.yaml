      - 更新
      - 変更許可
      - 変更届
  - id: 07-提出窓口-9a8b50d0
    観点: 提出窓口
    主張: 手引きでは、本社が県外でも県内に産廃業務を行う事務所等があれば、その事務所等（複数なら主要なもの）を管轄する地方振興局が窓口とされている。
    種別: 手引き
    出典:
      文書: 751868.pdf
      物理ページ: 9
      印字ページ: 7
      引用: 事務所等が所在する地域を管轄する地方振興局が受付窓口となります。
      照合: 一致
    確認日: 2026-11-03
    対象:
      - 新規
      - 更新
      - 変更許可
      - 変更届
  - id: 07-提出窓口-ee14434e
    観点: 提出窓口
    主張: 手引きでは、本社が県外で県内に事務所等がない場合、県が委託する協会（福島県産業資源循環協会）の事前確認を経て本庁の産業廃棄物課が窓口とされている。
    種別: 手引き
    出典:
      文書: 751868.pdf
      物理ページ: 9
      印字ページ: 7
      引用: 県から委託を受けた事業者で事前確認を受けたのち、産業廃棄物課が受付窓口となります。
      照合: 一致
    確認日: 2026-11-03
    対象:
      - 新規
      - 更新
      - 変更許可
  - id: 07-提出方法-655a93e1
    観点: 提出方法
    主張: 手引きでは、申請は持参が原則とされ、本社が県外にある場合に限り郵送申請も可能とされている。電子申請への言及はない。
    種別: 手引き
    出典:
      文書: 751868.pdf
      物理ページ: 6
      印字ページ: 4
      引用: 受付は持参での申請が原則ですが、「本社が県外にある場合」（７ページを参照）には、郵送での申請も可能です。
      照合: 一致
    確認日: 2026-11-03
    対象:
      - 新規
      - 更新
      - 変更許可
  - id: 07-提出方法-c0386833
    観点: 提出方法
    主張: 手引きでは、郵送申請は産業廃棄物課へ直接送付し、郵送の場合も委託先の協会で申請前確認が行われるとされている。
    種別: 手引き
    出典:
      文書: 751868.pdf
      物理ページ: 10
      印字ページ: 8
      引用: 郵送で申請する場合、産業廃棄物課に直接送付してください。なお、郵送で申請した場合も協会で申請前確認をします。
      照合: 一致
    確認日: 2026-11-03
    対象:
      - 新規
      - 更新
      - 変更許可
