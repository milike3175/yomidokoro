記録:
  - id: 28-届と許可の線引き-422ad634
    観点: 届と許可の線引き
    主張: 手引きでは、役員や車両・駐車場など事業の用に供する施設の変更は変更後10日以内の変更届とされ、品目の追加や限定条件の解除は変更許可申請が必要とされている。
    種別: 手引き
    出典:
      文書: 〈新規〉許可申請要領【R8.5】.pdf
      物理ページ: 7
      印字ページ: 6
      引用: 取扱う産業廃棄物を追加したい。許可品目の限定条件を解除したい。→変更許可申請が必要です。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 変更許可
      - 変更届
  - id: 28-届と許可の線引き-e3647eed
    観点: 届と許可の線引き
    主張: よくある質問では、取扱品目を減らす場合は事業の一部廃止に当たるため変更許可は不要とされ、車両・容器など施設の変更も事業範囲の変更には当たらず変更届の対象とされている。
    種別: 手引き
    出典:
      文書: よくある質問.pdf
      物理ページ: 4
      印字ページ: null
      引用: 取扱う産業廃棄物を減らす場合は、事業の一部廃止に該当するため、変更許可は不要です。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 変更許可
      - 変更届
  - id: 28-届と許可の線引き-f8e97d9a
    観点: 届と許可の線引き
    主張: 石綿含有・水銀使用製品・水銀含有ばいじん等の付加区分は、「含む」から「含まない」への変更は変更届出書、「含まない」から「含む」への変更は事業範囲の変更許可申請書とされている。
    種別: 手引き
    出典:
      文書: 〈変更〉許可申請要領【R8.5】.pdf
      物理ページ: 16
      印字ページ: 15
      引用: 「含まない」から「含む」に変更される場合は事業範囲の変更許可申請書を提出してください。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 変更許可
      - 変更届
    品目:
      - 石綿含有産業廃棄物
      - 水銀使用製品産業廃棄物
      - 水銀含有ばいじん等
  - id: 28-車両変更届-ee22e67a
    観点: 車両変更届
    主張: 手引きでは、車両・駐車場を含む施設等の変更は変更後10日以内に変更届を出すこととされ、登記事項証明を要する変更は30日以内とされている。詳細は別冊の変更届出要領を参照とされている。
    種別: 手引き
    出典:
      文書: 〈新規〉許可申請要領【R8.5】.pdf
      物理ページ: 7
      印字ページ: 6
      引用: 以下の①～④を変更する場合は、変更後10 日以内に変更届を提出する必要があります。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 変更届
  - id: 28-車両変更届-89a48d24
    観点: 車両変更届
    主張: 手引きでは、他の申請・届出と同時に提出する場合、添付書類の省略に関する申立書（別紙８）を出すことで、写真や車検証写しなど一部の添付書類を省略できるとされている。
    種別: 手引き
    出典:
      文書: 〈変更〉許可申請要領【R8.5】.pdf
      物理ページ: 7
      印字ページ: 6
      引用: 申請（届出）添付書類の省略に関する申立書（別紙８）を提出することで一部の提出書類について省略が可能です。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 新規
      - 更新
      - 変更許可
      - 変更届
  - id: 28-車両変更届-b8cf3749
    観点: 車両変更届
    主張: よくある質問では、更新申請の際に車両の変更が判明した場合は、更新許可申請と併せて変更届を提出する必要があるとされている。
    種別: 手引き
    出典:
      文書: よくある質問.pdf
      物理ページ: 5
      印字ページ: null
      引用: Ａ３．更新許可申請と併せて、変更届の提出が必要です。
      照合: 一致
    確認日: 2026-11-02
    対象:
      - 更新
      - 変更届
  - id: 28-提出窓口-ec6ef017
    観点: 提出窓口
    主張: 手引きでは、兵庫県知事許可は本庁ではなく出先の県民局に申請し、政令市1市内のみで運ぶ場合は当該政令市に申請するとされている。
