  - id: 15-経理的基礎-2dc0088e
    観点: 経理的基礎
    主張: 手引きでは、経理的基礎の目安として、原則、利益が計上できているか自己資本比率が1割を超えていること（少なくとも債務超過でないこと）が求められるとされている。
    種別: 手引き
    出典:
      文書: 513307.pdf
      物理ページ: 5
      印字ページ: 4
      引用: 利益が計上できていること又は自己資本比率が１割を超えていること（少なくとも債務超過の状態でないこと）が必要です
      照合: 一致
    確認日: 2026-11-03
    対象:
      - 新規
      - 更新
      - 変更許可
  - id: 15-経理的基礎-34a5e1bc
    観点: 経理的基礎
    主張: 手引きでは、法人は①直前3年の経常損益平均が欠損かつ自己資本比率1割以下（直前期黒字転換を除く）、②直前期債務超過のいずれかなら経営改善計画書（参考様式あり）を添付し、②では中小企業診断士の診断書等を求めることもあるとされている。
    種別: 手引き
    出典:
      文書: 513307.pdf
      物理ページ: 19
      印字ページ: 18
      引用: ②の場合、中小企業診断士による診断書等を求めることもあります。
      照合: 一致
    確認日: 2026-11-03
    対象:
      - 新規
      - 更新
      - 変更許可
  - id: 15-経理的基礎-8bb22d4b
    観点: 経理的基礎
    主張: 手引きでは、法人で初年度決算が未了の場合、資産に関する調書（個人用・第9面）と今後5年間の事業計画書（様式任意）を作成し、資産・負債を証する書類を添付するとされている。個人は負債計が資産計を上回れば経営改善計画書を添付する。
    種別: 手引き
    出典:
      文書: 513307.pdf
      物理ページ: 16
      印字ページ: 15
      引用: 初年度の決算が済んでいない場合は、資産に関する調書（個人用）
