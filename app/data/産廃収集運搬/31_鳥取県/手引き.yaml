観点候補:
  - 名前: 許可証の交付方法
    主張: 手引きでは、許可等の処分後、特に申し出がなければ許可証は申請者の住所へ郵送されるとされている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
    引用: 許可等の処分がなされたときは、特に申し出がない場合は、申請者の住所へ郵送します。
    物理ページ: 11
  - 名前: 更新申請の時期目安
    主張: 手引きでは、更新許可の手続は許可期限の2か月前を目安とし、更新の案内は行われないとされている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
    引用: 更新許可の手続は、許可期限の2 か月前を目安に行ってください。（更新の案内は、ありませんので、注意してください。）
    物理ページ: 12
  - 名前: 他県様式の使用可否
    主張: 手引きでは、法定外様式は所要事項がすべて記載されていれば類似様式や他県の様式でも差し支えないとされている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
    引用: 所要の事項がすべて記載されていれば類似様式、他県の様式であっても差し支えありません。
    物理ページ: 6
  - 名前: 処理実績報告書の提出
    主張: 手引きでは、施行細則に基づき毎年6月30日までに前年度1年間の収集運搬実績を報告する必要があり、実績がない場合も提出が必要とされている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
    引用: 毎年6 月30 日までに、その年の3 月31 日以前の1 年間における（特別管理）産業廃棄物の収集・運搬に関する実績について報告しなければなりません
    物理ページ: 12
  - 名前: 処理実績報告書の提出期限
    主張: 手引きでは、施行細則に基づき毎年6月30日までに前年度の収集運搬実績を報告する必要があり、実績がない場合も提出が要るとされている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
    引用: 毎年6 月30 日までに、その年の3 月31 日以前の1 年間における（特別管理）産業廃棄物の収集・運搬に関する実績について報告しなければなりません
    物理ページ: 12
  - 名前: 手続き条例非適用の証明書類に係る変更届
    主張: 手引きでは、手続き条例が適用されないことを証明する書類に関する変更届が、よくある変更の一つとして記載例に挙げられている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
    引用: ③手続き条例が適用されないことを証明する書類
