  - 名前: 感染性産業廃棄物の保冷車要件
    主張: 手引きでは、感染性産業廃棄物を運ぶには保冷車またはその他の運搬施設が必要で、保冷車の定義や、冷蔵冷凍車でない場合のメーカー証明書添付が示されている。
