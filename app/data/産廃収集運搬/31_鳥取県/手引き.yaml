  - 名前: PCB廃棄物収集運搬の追加添付書類
    主張: 手引きでは、PCB廃棄物の収集運搬を申請する場合、通常の添付書類に加え、容器構造図、GPS概要、緊急時マニュアル、従事者講習修了証写しなど独自の一覧に基づく書類が必要とされている。
    文書: 101_Shinsei_Tebiki_Shuun_Tsumiho_Nashi_Honbun_R3.4.pdf
