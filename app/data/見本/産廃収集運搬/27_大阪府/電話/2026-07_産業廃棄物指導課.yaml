# 作者が2026年7月に大阪府に電話で確かめた実際の記録。依頼者の情報と担当者の個人名は含まない
# （公開版で電話の記録がどう見えるかを示すため、作者の手帳の記録から写したもの。置き場の名前「見本」は、公開版に載せる記録の置き場という意味）
id: 27-電話-2026-07-1
許可権者: { コード: "27", 名前: 大阪府 }
許認可: 産廃収集運搬
確認日: 2026-07          # 年月まで（議事録ページの更新月）
窓口: 環境農林水産部 循環型社会推進室 産業廃棄物指導課
種別: 電話
記録者: 本人
取込元: 議事録
見本: true
回答:
  - 観点: 排出事業者
    問い: 建設系以外の品目で、排出事業場がまだ決まっていない場合の書き方
    答え: 「大阪府内」のような概括の書き方は不可。具体的な企業名を書く。契約先が未定なら、ホームページ等で調べた企業名でよい（計画段階のため）。申請後に実際の契約先が変わっても問題ない
    対象: [変更許可]
    品目: 建設系以外
  - 観点: 運搬先
    問い: 建設系以外の品目で、運搬先がまだ決まっていない場合の書き方
    答え: 排出事業場と同じ。概括は不可で、調べた企業名を予定として書いてよい
    対象: [変更許可]
    品目: 建設系以外
  - 観点: 変更許可範囲
    問い: 品目追加の変更許可で、申請書と事業計画の概要に書く範囲
    答え: 申請書1面の「許可に関する事業の範囲」は現在の許可内容、「変更の内容」は追加する品目だけ。事業計画の概要（排出事業場・運搬先など）も追加する品目分だけでよい。運搬容器（2面の車両欄の下）も追加品目に使うものだけ
    対象: [変更許可]
  - 観点: 性状
    問い: 性状は「固形」「泥状」で足りるか
    答え: 性状だけでなく、手引き2ページの「種類」と「具体例」の表を見て、実際に運ぶものを具体的に書くのが望ましい
    対象: [変更許可]
    手引きへの参照: { ページ: 2, 内容: 種類と具体例の表 }
  - 観点: 写真要件
    問い: 運搬容器の写真の撮り方の注意
    答え: 社名を一緒に写すなどの指定はない。ドラム缶のように横からではフタの状態が分かりにくい容器は、正面・上面など複数の角度で撮る
    対象: [変更許可]
  - 観点: 事前審査予約
    問い: 変更許可にも事前審査があるか
    答え: 変更許可でも事前審査がある
    対象: [変更許可]
  - 観点: 提出方法
    問い: 事前審査と本審査の出し方
    答え: 事前審査は郵送で申請できる。担当から連絡を受け、補正があれば直したうえで、本審査は窓口に持参する
    対象: [変更許可]
個人名削除: 0
